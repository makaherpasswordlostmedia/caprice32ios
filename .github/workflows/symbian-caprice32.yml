          #!/bin/bash
          # Host smoke test: builds the exact Symbian core sources with freestanding flags on Linux, boots a CPC6128
          # headless for 400 frames, types  PRINT 6*7  and checks that the BASIC screen shows up.
          # Run from the caprice32 repository root after symbian/tools/stage.sh.
          set -euo pipefail
          ROOT=$(pwd); P=$ROOT/symbian; O=${TMPDIR:-/tmp}/cap32_host; rm -rf "$O"; mkdir -p "$O/obj" "$O/run/rom"
          FLAGS="-std=gnu++17 -ffreestanding -fno-exceptions -fno-rtti -nostdinc -nostdinc++ -I$P/compat -I$P/sdl -I$P/inc -I$P/stage \
           -DCAPRICE_NO_WGUI -DCAPRICE_NO_LOG -DCAPRICE_FORCE_KEY_JOYSTICK -DCAPRICE_FAST_VIDEO -DCAPRICE_IOS7 -DCAPRICE_SYMBIAN -DNDEBUG -w"
          SRCS="$(ls $P/stage/*.cpp) $P/compat/compat.cpp $P/sdl/sdl_lite.cpp $P/src/port_stubs.cpp"
          pids=""
          for f in $SRCS; do
            b=$(basename "$f" .cpp)
            case $b in compat) X="-DCOMPAT_HOST_LIBC";; *) X="";; esac
            g++ $FLAGS $X -O1 -c "$f" -o "$O/obj/$b.o" & pids="$pids $!"
          done
          for p in $pids; do wait $p; done
          # host harness + backend use the real libc / libstdc++ (compat headers only as a fallback for plat.h)
          HF="-std=gnu++17 -O1 -w -fno-exceptions -fno-rtti -I$P/inc -I$P/sdl -I$P/stage -idirafter $P/compat"
          g++ $HF -c "$P/tools/host/host_main.cpp" -o "$O/obj/host_main.o"
          g++ $HF -c "$P/tools/host/plat_host.cpp" -o "$O/obj/plat_host.o"
          g++ -o "$O/cap32_host" "$O"/obj/*.o -ldl
          cp "$ROOT"/rom/*.rom "$O/run/rom/"; cp "$P/data/cap32.cfg" "$O/run/.cap32.cfg"
          ( cd "$O/run" && timeout 300 ../cap32_host 400 "$O/run" )
          python3 - "$O/run/frame400.ppm" <<'PY'
          import sys
          d=open(sys.argv[1],'rb').read()
          if d[:2]==b'P6': parts=d.split(b'\n',3); w,h=map(int,parts[1].split()); px=parts[3]
          else: px=d; w,h=384,len(d)//(384*3)
          cols={}
          for i in range(0,len(px)-2,3): cols[px[i:i+3]]=cols.get(px[i:i+3],0)+1
          print("frame",w,h,"distinct colours",len(cols))
          assert len(cols)>=2 and max(cols.values())<w*h*0.995, "frame is blank"
          PY
          echo "host smoke test OK"
          CAP32_EOF
