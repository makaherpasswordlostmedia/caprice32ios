          boot_time=42
          # net4cpc
          #   Support for Net4CPC emulation which provides Ethernet connectivity to the CPC.
          #   See https://github.com/salafek/Net4CPC for details about Net4CPC.
          net4cpc=0

          [video]
          # scr_scale
          #   The scale factor to apply to the CPC screen.
          #    1 = 384x270
          #    2 = 768x540
          #    3 = 1152x810
          #    4 = 1536x1080
          #    5 = 1920x1350
          #    6 = 2304x1620
          #    7 = 2688x1890
          #    8 = 3072x2160
          scr_scale=1
          # scr_preserve_aspect_ratio
          #   Whether to preserve the aspect ratio or to stretch to the monitor size when in fullscreen.
          scr_preserve_aspect_ratio=1
          # scr_style
          #   0: Half size with hardware flip
          #   1: Double size with hardware flip
          #   2: Half size
          #   3: Double size
