          }
          size_t fwrite(const void* d, size_t sz, size_t n, FILE* f) {
            if (!f) return 0; size_t t = sz * n;
            if (f->h < 0) {                                   // stdout/stderr: discard (echo to fd 2 in host tests)
          #ifdef CP_ECHO
              plat_write(2, d, (long)t);
          #endif
              return n;
            }
            if (!f->wr) { f->err = 1; return 0; }
            const unsigned char* s = (const unsigned char*)d;
            if (t >= CP_BUF) { if (fl(f)) return 0; long w = plat_write(f->h, s, (long)t); if (w < (long)t) { f->err = 1; return sz ? (size_t)(w < 0 ? 0 : w) / sz : 0; } return n; }
