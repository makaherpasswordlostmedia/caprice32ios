          size_t fread(void* d, size_t sz, size_t n, FILE* f) {
            if (!f || f->h < 0 || f->wr || !sz) return 0;
            size_t want = sz * n, got = 0; unsigned char* o = (unsigned char*)d;
            if (f->ungot >= 0 && want) { *o++ = (unsigned char)f->ungot; f->ungot = -1; ++got; }
            while (got < want) {
              if (f->bpos < f->blen) { size_t k = f->blen - f->bpos; if (k > want - got) k = want - got; memcpy(o + got, f->buf + f->bpos, k); f->bpos += (int)k; got += k; continue; }
              if (want - got >= CP_BUF) { long r = plat_read(f->h, o + got, (long)(want - got)); if (r <= 0) { f->eof = 1; break; } got += r; continue; }
              long r = plat_read(f->h, f->buf, CP_BUF); if (r <= 0) { f->eof = 1; break; } f->bpos = 0; f->blen = (int)r;
            }
