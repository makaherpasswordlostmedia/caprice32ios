          // SDL2-lite implementation: software surfaces, an event queue, a pull-style audio device,
          // and "texture present" forwarded to the platform via lite_present().
          #include "SDL.h"
          #include <stdlib.h>
          #include <string.h>
          #include <stdio.h>
          #include <stdarg.h>

          static char g_err[128] = "";
          extern "C" const char* SDL_GetError(void) { return g_err; }
          extern "C" int SDL_SetError(const char* f, ...) { va_list ap; va_start(ap, f); vsnprintf(g_err, sizeof g_err, f, ap); va_end(ap); return -1; }

          // ---------------------------------------------------------------- init / time
          extern "C" int SDL_Init(Uint32) { return 0; }
          extern "C" int SDL_InitSubSystem(Uint32) { return 0; }
          extern "C" void SDL_QuitSubSystem(Uint32) {}
          extern "C" void SDL_Quit(void) {}
          extern "C" Uint32 SDL_GetTicks(void) { return lite_ticks(); }
          extern "C" SDL_bool SDL_SetHint(const char*, const char*) { return SDL_TRUE; }
          extern "C" int SDL_SetRelativeMouseMode(SDL_bool) { return 0; }
          extern "C" int SDL_ShowCursor(int) { return 0; }
          extern "C" void SDL_StartTextInput(void) {}
          extern "C" void SDL_StopTextInput(void) {}
          extern "C" const char* SDL_GetKeyName(SDL_Keycode) { return ""; }
          extern "C" char* SDL_GetClipboardText(void) { return (char*)calloc(1, 1); }

          // ---------------------------------------------------------------- audio (declared first: SDL_Delay services it)
          static SDL_AudioSpec g_aspec; static int g_aopen = 0, g_apaused = 1; static Uint8* g_abuf = 0;
          static void service_audio() {
            if (!g_aopen || g_apaused || !g_aspec.callback) return;
            int guard = 8;
            while (guard-- > 0 && lite_audio_can_write()) {
              memset(g_abuf, g_aspec.silence, g_aspec.size);
              g_aspec.callback(g_aspec.userdata, g_abuf, (int)g_aspec.size);
              lite_audio_write(g_abuf, (int)g_aspec.size);
            }
          }
          extern "C" int SDL_GetNumAudioDevices(int) { return 1; }
          extern "C" const char* SDL_GetAudioDeviceName(int, int) { return "default"; }
          extern "C" SDL_AudioDeviceID SDL_OpenAudioDevice(const char*, int, const SDL_AudioSpec* d, SDL_AudioSpec* o, int) {
            if (g_aopen) return 0;
            g_aspec = *d; int bits = (d->format & 0xFF) ; g_aspec.silence = (bits == 8) ? 0 : 0;
            g_aspec.size = (Uint32)d->samples * d->channels * (bits / 8);
            if (!lite_audio_open(d->freq, d->channels, bits, d->samples)) { SDL_SetError("audio device unavailable"); return 0; }
            g_abuf = (Uint8*)malloc(g_aspec.size); g_aopen = 1; g_apaused = 1;
            if (o) *o = g_aspec;
            return 1;
          }
          extern "C" void SDL_CloseAudioDevice(SDL_AudioDeviceID) { if (g_aopen) { lite_audio_close(); free(g_abuf); g_abuf = 0; g_aopen = 0; } }
          extern "C" void SDL_PauseAudioDevice(SDL_AudioDeviceID, int p) { g_apaused = p; if (g_aopen) lite_audio_pause(p); }
          extern "C" void SDL_PauseAudio(int p) { SDL_PauseAudioDevice(1, p); }

          // ---------------------------------------------------------------- events
          #define QN 256
          static SDL_Event g_q[QN]; static int g_qh = 0, g_qt = 0;
          void lite_queue_event(const SDL_Event& e) { int n = (g_qt + 1) % QN; if (n == g_qh) return; g_q[g_qt] = e; g_qt = n; }
          extern "C" int SDL_PushEvent(SDL_Event* e) { lite_queue_event(*e); return 1; }
          extern "C" int SDL_PollEvent(SDL_Event* e) {
            if (g_qh == g_qt) { lite_pump(0); service_audio(); }
            if (g_qh == g_qt) return 0;
            if (e) *e = g_q[g_qh]; g_qh = (g_qh + 1) % QN; return 1;
          }
          // The core waits for the audio callback with SDL_Delay(1).  A timed 1 ms pump on Symbian really sleeps one
          // 64 Hz timer tick (~15.6 ms), so every sound buffer cost at least that and the emulator ran far below real
          // time (the watchdog showed ~140 progress ticks/s = 2 per Pump).  Short delays only yield to the scheduler.
          extern "C" void SDL_Delay(Uint32 ms) { service_audio(); lite_pump(ms <= 2 ? 0 : (int)ms); service_audio(); }

          // ---------------------------------------------------------------- joystick (none)
          extern "C" int SDL_NumJoysticks(void) { return 0; }
          extern "C" SDL_Joystick* SDL_JoystickOpen(int) { return 0; }
          extern "C" void SDL_JoystickClose(SDL_Joystick*) {}
          extern "C" int SDL_JoystickEventState(int) { return 0; }

          // ---------------------------------------------------------------- surfaces
          extern "C" SDL_Surface* SDL_CreateRGBSurface(Uint32, int w, int h, int bpp, Uint32 rm, Uint32 gm, Uint32 bm, Uint32 am) {
            SDL_Surface* s = (SDL_Surface*)calloc(1, sizeof(SDL_Surface));
            SDL_PixelFormat* f = (SDL_PixelFormat*)calloc(1, sizeof(SDL_PixelFormat));
            s->format = f; s->w = w; s->h = h; f->BitsPerPixel = (Uint8)bpp; f->BytesPerPixel = (Uint8)((bpp + 7) / 8);
            if (bpp == 32 && !rm && !gm && !bm) { rm = 0x00FF0000; gm = 0x0000FF00; bm = 0x000000FF; }
            if (bpp == 16 && !rm && !gm && !bm) { rm = 0xF800; gm = 0x07E0; bm = 0x001F; }
            f->Rmask = rm; f->Gmask = gm; f->Bmask = bm; f->Amask = am;
            s->pitch = (w * f->BytesPerPixel + 3) & ~3;
            s->pixels = calloc(1, (size_t)s->pitch * (h ? h : 1) + 16);
            if (bpp == 8) { f->palette = (SDL_Palette*)calloc(1, sizeof(SDL_Palette)); f->palette->ncolors = 256; f->palette->colors = (SDL_Color*)calloc(256, sizeof(SDL_Color)); }
            s->clip_rect.x = 0; s->clip_rect.y = 0; s->clip_rect.w = w; s->clip_rect.h = h; s->refcount = 1;
            return s;
          }
          extern "C" void SDL_FreeSurface(SDL_Surface* s) {
            if (!s) return;
            if (s->format) { if (s->format->palette) { free(s->format->palette->colors); free(s->format->palette); } free(s->format); }
            free(s->pixels); free(s);
          }
          extern "C" int SDL_LockSurface(SDL_Surface*) { return 0; }
          extern "C" void SDL_UnlockSurface(SDL_Surface*) {}
          extern "C" Uint32 SDL_MapRGB(const SDL_PixelFormat* f, Uint8 r, Uint8 g, Uint8 b) {
            if (f->BitsPerPixel == 32) return ((Uint32)r << 16) | ((Uint32)g << 8) | b;
            if (f->BitsPerPixel == 16) return (Uint32)(((r >> 3) << 11) | ((g >> 2) << 5) | (b >> 3));
            if (f->palette) { int best = 0; int bd = 1 << 30; for (int i = 0; i < f->palette->ncolors; ++i) { int dr = f->palette->colors[i].r - r, dg = f->palette->colors[i].g - g, db = f->palette->colors[i].b - b; int d = dr * dr + dg * dg + db * db; if (d < bd) { bd = d; best = i; } } return (Uint32)best; }
            return 0;
          }
          extern "C" int SDL_SetPaletteColors(SDL_Palette* p, const SDL_Color* c, int first, int n) {
            if (!p) return -1; if (first + n > p->ncolors) n = p->ncolors - first; for (int i = 0; i < n; ++i) p->colors[first + i] = c[i]; return 0;
          }
          extern "C" int SDL_FillRect(SDL_Surface* s, const SDL_Rect* r, Uint32 col) {
            SDL_Rect a = { 0, 0, s->w, s->h }; if (r) { a = *r; if (a.x < 0) { a.w += a.x; a.x = 0; } if (a.y < 0) { a.h += a.y; a.y = 0; } if (a.x + a.w > s->w) a.w = s->w - a.x; if (a.y + a.h > s->h) a.h = s->h - a.y; }
            int bpp = s->format->BytesPerPixel;
            for (int y = 0; y < a.h; ++y) { Uint8* row = (Uint8*)s->pixels + (size_t)(a.y + y) * s->pitch + a.x * bpp;
              if (bpp == 4) { Uint32* p = (Uint32*)row; for (int x = 0; x < a.w; ++x) p[x] = col; }
              else if (bpp == 2) { Uint16* p = (Uint16*)row; for (int x = 0; x < a.w; ++x) p[x] = (Uint16)col; }
              else memset(row, (int)col, (size_t)a.w); }
            return 0;
          }
          extern "C" int SDL_BlitSurface(SDL_Surface* s, const SDL_Rect* sr, SDL_Surface* d, SDL_Rect* dr) {
            SDL_Rect a = { 0, 0, s->w, s->h }; if (sr) a = *sr;
            int dx = dr ? dr->x : 0, dy = dr ? dr->y : 0;
            if (dx < 0) { a.x -= dx; a.w += dx; dx = 0; } if (dy < 0) { a.y -= dy; a.h += dy; dy = 0; }
            if (dx + a.w > d->w) a.w = d->w - dx; if (dy + a.h > d->h) a.h = d->h - dy;
            int sb = s->format->BytesPerPixel, db = d->format->BytesPerPixel;
            for (int y = 0; y < a.h; ++y) {
              const Uint8* sp = (const Uint8*)s->pixels + (size_t)(a.y + y) * s->pitch + a.x * sb; Uint8* dp = (Uint8*)d->pixels + (size_t)(dy + y) * d->pitch + dx * db;
              if (sb == db) memcpy(dp, sp, (size_t)a.w * sb);
              else if (sb == 1 && db == 4 && s->format->palette) { for (int x = 0; x < a.w; ++x) { const SDL_Color& c = s->format->palette->colors[sp[x]]; ((Uint32*)dp)[x] = ((Uint32)c.r << 16) | ((Uint32)c.g << 8) | c.b; } }
            }
            return 0;
          }
          extern "C" int SDL_LowerBlit(SDL_Surface* s, SDL_Rect* sr, SDL_Surface* d, SDL_Rect* dr) { return SDL_BlitSurface(s, sr, d, dr); }

          // ---------------------------------------------------------------- window / renderer / texture
          struct SDL_Window { int w, h; };
          struct SDL_Renderer { SDL_Window* win; SDL_Texture* tex; SDL_Rect src, dst; int hasSrc, hasDst; };
          struct SDL_Texture { int w, h; Uint32* pix; };
          static SDL_Window g_win;
          extern "C" int SDL_CreateWindowAndRenderer(int, int, Uint32, SDL_Window** w, SDL_Renderer** r) {
            lite_screen_size(&g_win.w, &g_win.h); *w = &g_win; *r = SDL_CreateRenderer(&g_win, -1, 0); return 0;
          }
          extern "C" SDL_Window* SDL_CreateWindow(const char*, int, int, int, int, Uint32) { lite_screen_size(&g_win.w, &g_win.h); return &g_win; }
          extern "C" void SDL_DestroyWindow(SDL_Window*) {}
          extern "C" void SDL_SetWindowTitle(SDL_Window*, const char*) {}
          extern "C" void SDL_GetWindowSize(SDL_Window* w, int* a, int* b) { lite_screen_size(&w->w, &w->h); if (a) *a = w->w; if (b) *b = w->h; }
          extern "C" Uint32 SDL_GetWindowFlags(SDL_Window*) { return SDL_WINDOW_SHOWN; }
          extern "C" SDL_Renderer* SDL_CreateRenderer(SDL_Window* w, int, Uint32) { SDL_Renderer* r = (SDL_Renderer*)calloc(1, sizeof(SDL_Renderer)); r->win = w; return r; }
          extern "C" void SDL_DestroyRenderer(SDL_Renderer* r) { free(r); }
          extern "C" int SDL_GetRendererInfo(SDL_Renderer*, SDL_RendererInfo* i) { memset(i, 0, sizeof *i); i->name = "lite"; i->num_texture_formats = 1; i->texture_formats[0] = (32u << 8) | 0x16000000u; return 0; }
          extern "C" SDL_Texture* SDL_CreateTextureFromSurface(SDL_Renderer*, SDL_Surface* s) {
            SDL_Texture* t = (SDL_Texture*)calloc(1, sizeof(SDL_Texture)); t->w = s->w; t->h = s->h; t->pix = (Uint32*)calloc((size_t)s->w * s->h, 4); return t;
          }
          extern "C" void SDL_DestroyTexture(SDL_Texture* t) { if (t) { free(t->pix); free(t); } }
          extern "C" int SDL_UpdateTexture(SDL_Texture* t, const SDL_Rect*, const void* px, int pitch) {
            for (int y = 0; y < t->h; ++y) memcpy(t->pix + (size_t)y * t->w, (const Uint8*)px + (size_t)y * pitch, (size_t)t->w * 4); return 0;
          }
          extern "C" int SDL_RenderClear(SDL_Renderer*) { return 0; }
          extern "C" int SDL_RenderCopy(SDL_Renderer* r, SDL_Texture* t, const SDL_Rect* s, const SDL_Rect* d) {
            r->tex = t; r->hasSrc = s != 0; r->hasDst = d != 0; if (s) r->src = *s; if (d) r->dst = *d; return 0;
          }
          extern "C" void SDL_RenderPresent(SDL_Renderer* r) {
            if (!r->tex) return; SDL_Rect s = { 0, 0, r->tex->w, r->tex->h }; if (r->hasSrc) s = r->src;
            SDL_Rect d = { 0, 0, r->win->w, r->win->h }; if (r->hasDst) d = r->dst;
            lite_present((const unsigned int*)r->tex->pix, r->tex->w, r->tex->h, r->tex->w * 4, s.x, s.y, s.w, s.h, d.x, d.y, d.w, d.h, r->win->w, r->win->h);
          }

          // ---------------------------------------------------------------- posting API used by the front end
          extern "C" void lite_post_key(int down, int scancode, int keycode, int mod) {
            SDL_Event e; memset(&e, 0, sizeof e);
            e.type = down ? SDL_KEYDOWN : SDL_KEYUP; e.key.state = down ? SDL_PRESSED : SDL_RELEASED;
            e.key.keysym.scancode = (SDL_Scancode)scancode; e.key.keysym.sym = keycode; e.key.keysym.mod = (Uint16)mod; lite_queue_event(e);
          }
          extern "C" void lite_post_window(int id) { SDL_Event e; memset(&e, 0, sizeof e); e.type = SDL_WINDOWEVENT; e.window.event = (Uint8)id; lite_queue_event(e); }
          extern "C" void lite_post_quit(void) { SDL_Event e; memset(&e, 0, sizeof e); e.type = SDL_QUIT; lite_queue_event(e); }
          #include "cap32.h"
          extern "C" int cap32_main_c(int argc, char** argv) { return cap32_main(argc, argv); }
