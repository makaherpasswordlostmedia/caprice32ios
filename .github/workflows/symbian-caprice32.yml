          GLint glGetUniformLocation(GLuint aProg, const GLchar* aName);
          void glLinkProgram(GLuint aProg);
          void glShaderSource(GLuint aShader, GLsizei aCount, const GLchar** aStrings, const GLint* aLengths);
          void glTexImage2D(GLenum aTarget, GLint aLevel, GLint aInternal, GLsizei aW, GLsizei aH, GLint aBorder,
                            GLenum aFormat, GLenum aType, const GLvoid* aPixels);
          void glTexParameteri(GLenum aTarget, GLenum aPname, GLint aParam);
          void glTexSubImage2D(GLenum aTarget, GLint aLevel, GLint aX, GLint aY, GLsizei aW, GLsizei aH,
