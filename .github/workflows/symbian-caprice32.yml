name: Build Symbian^3 SIS (Caprice32)

# SELF-CONTAINED: this single file carries the whole Symbian port (symbian/ tree) and writes it
# at build time, so the repository only needs the original caprice32ios sources + this workflow.
#
# Uses https://github.com/fieldops-dev/symbian3-toolchain, which targets Apple Silicon macOS,
# so the SIS job runs on a macos (arm64) runner.  The first run builds GCC for arm-none-symbianelf
# (about 1.5-2 h) and caches the toolchain + SDK; later runs only compile the app.
#
# Stages:  sources  -> writes symbian/, stages src/ with the port overrides, fetches SDL2 key tables
#          host-test -> builds the very same core sources on Linux and boots a CPC6128 headless
#          build-sis -> cap32core.lib (C++17) + cap32.exe (C++98 Avkon) -> signed cap32.sisx
#
# NOTE: the Symbian-specific code (Avkon, RFs, MMF, .mmp/.pkg behaviour) is not covered by host-test;
# expect to iterate on the first run of build-sis.

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  TOOLCHAIN_REPO: fieldops-dev/symbian3-toolchain
  TOOLCHAIN_REF: a96f917e6c8f02fe4f7c2186f8df760d3d9d832a
  SYMBIAN_VOL: /Volumes/Symbian
  GNUPOC_COMMIT: d3ddaf58c734ad3ab34dc60a012f9d4768a9ed3e
  GCC4SYMBIAN_COMMIT: fe1b15a1c25716d5c515f12593080d58f14d4c3f

jobs:
  sources:
    name: Write port sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write symbian/ files
        run: |
          set -e
          mkdir -p symbian
          cat > symbian/README.md <<'CAP32_EOF'
          # Caprice32 for Symbian^3

          Native Symbian^3 (Nokia N8, C7, E7, ...) port of the Caprice32 Amstrad CPC emulator (caprice32ios sources),
          built in GitHub Actions with [fieldops-dev/symbian3-toolchain](https://github.com/fieldops-dev/symbian3-toolchain).

          The emulator sources in `src/` are untouched. This tree (written by the workflow) adds:

          | Path | Contents |
          |---|---|
          | `compat/` | tiny freestanding libc / libstdc++ subset (the toolchain has no hosted C/C++ library): `<string>`, `<vector>`, `<map>`, stdio-style FILE layer, printf, qsort, ... |
          | `sdl/` | "SDL-lite": the SDL2 subset Caprice32 uses (surfaces, events, audio pull-model, renderer) on top of C hooks |
          | `inc/lite_hooks.h` | plain-C boundary between the core (C++17) and the front end (C++98/Avkon) |
          | `src/`, `overrides/` | stubs for unsupported features (zip, IPF, PNG, net), no-op crashlog |
          | `app/` | Avkon front end: nested active-scheduler emulator loop, on-screen CPC keyboard, multitouch pad, MMF audio, `.rss`/`.pkg` |
          | `group_core/`, `group_app/` | `cap32core.lib` (built as C++17) and `cap32.exe` (C++98 Avkon) |
          | `tools/` | `stage.sh` (staging + .mmp generation), `host_test.sh` (Linux smoke test of the core) |

          ## Using it

          Copy disk images (`.dsk`, `.cdt`, `.voc`, `.sna`, `.cpr`) to `E:\caprice32\` or `E:\caprice32\disks\`; the newest one
          is mounted at start. The CPC ROMs are installed with the SIS into `!:\caprice32\rom\`.
          Config: `\caprice32\cap32.cfg`. Menu (top right): Resume / Reset (F5) / Speed (F9) / FPS (F8) / Joystick (F7) / Exit (F10).
          `KB` shows the on-screen CPC keyboard. Touch: left side D-pad, right side fire A/B (multitouch). Hardware keys: arrows,
          centre = fire, soft keys = menu/exit.

          Not supported: zip archives, IPF, PNG screenshots, network, the wGui menu.
          CAP32_EOF
      - name: Write symbian/app files
        run: |
          set -e
          mkdir -p symbian/app/data
          cat > symbian/app/data/cap32.rss <<'CAP32_EOF'
          NAME CAP3

          #include <eikon.rh>
          #include <avkon.rh>
          #include <avkon.rsg>
          #include <appinfo.rh>

          RESOURCE RSS_SIGNATURE { }

          RESOURCE TBUF r_default_document_name { buf = ""; }

          RESOURCE EIK_APP_INFO
              {
              }

          RESOURCE LOCALISABLE_APP_INFO r_localisable_app_info
              {
              short_caption = "Caprice32";
              caption_and_icon = CAPTION_AND_ICON_INFO
                  {
                  caption = "Caprice32";
                  number_of_icons = 0;
                  };
              }
          CAP32_EOF
          mkdir -p symbian/app/data
          cat > symbian/app/data/cap32_reg.rss <<'CAP32_EOF'
          #include <appinfo.rh>
          #include <cap32.rsg>

          UID2 KUidAppRegistrationResourceFile
          UID3 0xE1A5C032

          RESOURCE APP_REGISTRATION_INFO
              {
              app_file = "cap32";
              localisable_resource_file = "\\resource\\apps\\cap32";
              localisable_resource_id = R_LOCALISABLE_APP_INFO;
              embeddability = KAppNotEmbeddable;
              newfile = KAppDoesNotSupportNewFile;
              }
          CAP32_EOF
          mkdir -p symbian/app/inc
          cat > symbian/app/inc/cap32app.h <<'CAP32_EOF'
          // cap32app.h - Symbian^3 front end for the Caprice32 core (cap32core.lib).
          #ifndef CAP32APP_H
          #define CAP32APP_H

          #include <aknapp.h>
          #include <akndoc.h>
          #include <aknappui.h>
          #include <coecntrl.h>
          #include <e32base.h>
          #include <f32file.h>
          #include <fbs.h>
          #include <w32std.h>
          #include <mdaaudiooutputstream.h>

          const TUid KUidCap32 = { (TInt32)0xE1A5C032 };

          class CFbsBitmapDevice;
          class CFbsBitGc;

          // ---------------------------------------------------------------------------
          // Audio: pull model driven by the core (lite_audio_*), pushes PCM16 to an MMF stream.
          // ---------------------------------------------------------------------------
          class CCapAudio : public CBase, public MMdaAudioOutputStreamCallback
              {
          public:
              static CCapAudio* NewL(TInt aRate, TInt aChannels, TInt aSlotBytes);
              ~CCapAudio();
              TBool CanWrite();
              TBool Write(const TUint8* aData, TInt aLen);
              void Pause(TBool aPaused);

              void MaoscOpenComplete(TInt aError);
              void MaoscBufferCopied(TInt aError, const TDesC8& aBuffer);
              void MaoscPlayComplete(TInt aError);

          private:
              CCapAudio();
              void ConstructL(TInt aRate, TInt aChannels, TInt aSlotBytes);

              enum { KSlots = 4 };
              CMdaAudioOutputStream* iStream;
              TBool iReady;
              TBool iFailed;
              TBool iPaused;
              TInt iRate;
              TInt iChannels;
              TInt iSlotBytes;
              TUint iOpenTick;
              TUint iNextFake;
              TUint iLastAct;           // last time a buffer was queued or returned by the stream (stall detector)
              HBufC8* iBuf[KSlots];
              TBool iBusy[KSlots];
              };

          extern CCapAudio* gCapAudio;

          // ---------------------------------------------------------------------------
          // Main control: emulator host loop, game view, touch pad, on-screen keyboard, menu.
          // ---------------------------------------------------------------------------
          class CCapPump;
          class CCapIdle;

          class CCapContainer : public CCoeControl
              {
          public:
              static CCapContainer* NewL(const TRect& aRect);
              ~CCapContainer();
              void SetForeground(TBool aForeground);
              void RequestQuit();
              void PrepareExit();                  // release GL / audio / window before the process is killed

              // CCoeControl
              void Draw(const TRect& aRect) const;
              void SizeChanged();
              void HandlePointerEventL(const TPointerEvent& aEvent);
              TKeyResponse OfferKeyEventL(const TKeyEvent& aKeyEvent, TEventCode aType);

              // called by the core hooks
              void Present(const TUint32* aPix, TInt aW, TInt aH, TInt aPitch, const TRect& aSrc);
              void Pump(TInt aMs);
              void ToggleKeyboard();
              TSize ScreenSize() const { return Rect().Size(); }

              void PumpDone();

          private:
              enum { KMaxPtr = 6, KMaxPending = 16 };
              struct TPointerState { TBool iDown; TPoint iPos; TInt iHit; TInt iMod; };
              struct TPending { TBool iUsed; TInt iScan; TInt iSym; TInt iMod; TUint iDue; };

              CCapContainer();
              void ConstructL(const TRect& aRect);
              static TInt StartCb(TAny* aPtr);
              void RunEmulator();
              void PrepareStorage(TFileName& aBase);
              void FindNewest(const TDesC& aDir, TFileName& aBest, TTime& aBestTime);

              void ComputeLayout();
              TInt HitTest(const TPoint& aPt) const;       // region id, see .cpp
              void ApplyPointers();
              void KeyPress(TInt aScan, TInt aSym, TInt aMod);
              void KeyRelease(TInt aScan, TInt aSym, TInt aMod);
              void OnPress(TInt aHit, TPointerState& aState);
              void OnRelease(TInt aHit, TPointerState& aState);
              void ShowMessage(const TDesC& aMsg);
              void FlushPending();
              TInt KeyboardRowCount() const;
              TRect KeyRect(TInt aRow, TInt aStartUnits, TInt aWidthUnits, TInt aRowUnits) const;
              TBool MapSymbianKey(TInt aScanCode, TInt& aScan, TInt& aSym) const;
              void DrawButton(CGraphicsContext& aGc, const TRect& aRect, const TDesC& aLabel, TBool aDown) const;
              void DrawKeyboard(CGraphicsContext& aGc) const;
              void DrawMenu(CGraphicsContext& aGc) const;
              void DrawPad(CGraphicsContext& aGc) const;
              void DrawOverlay(CGraphicsContext& aGc) const;   // buttons, menu, messages: window gc or the GL overlay bitmap
              TRect GameRect() const;
              void RedrawAll();
              void Refresh();                                  // redraw everything, through OpenGL ES 2 when it is active
              TBool TryInitGl();
              TBool PresentGl(const TUint32* aPix, TInt aH, TInt aPitch, const TRect& aSrc);
              TBool RenderGl();
              void UpdateOverlayTexture();
              void ShutdownGl();

              TRect iSrc;
              CAsyncCallBack* iStartCb;
              CCapPump* iPumpTimer;
              CCapIdle* iPumpIdle;
              CActiveSchedulerWait iWait;
              TBool iPumping;
              TBool iForeground;
              TBool iStarted;
              TBool iKeyboard;
              TBool iMenu;
              TBool iShiftLatch;
              TBool iCtrlLatch;
              TBool iDirty;
              TUint iLastFrameTick;     // frame-skip state (zero-initialised: CBase)
              TUint iFramePeriod16;     // smoothed time between emulated frames, ms * 16
              TInt  iSkipRun;           // (unused)
              TUint iPumpAcc;           // ms spent inside Pump() since the last shown frame
              TUint iPumpMs16;          // smoothed Pump() time per shown frame, ms * 16
              TUint iDrawMs16;          // smoothed cost of showing one frame, ms * 16 (measured incl. window server)
              TUint iWinTotal;          // profiling window: frames seen
              TUint iWinShown;          // profiling window: frames actually shown
              TBuf<40> iDbg;            // on-screen profiling text
              TInt iGlState;            // 0 = not tried yet, 1 = OpenGL ES 2 active, 2 = off (unavailable, failed or disabled)
              TBool iOverlayDirty;      // the buttons changed: re-render the overlay texture
              CFbsBitmap* iOvlBmp;      // GL mode: the buttons are drawn once into this bitmap and shown as a texture
              CFbsBitmapDevice* iOvlDev;
              CFbsBitGc* iOvlGc;
              TSize iOvlSize;
              TBool iQuit;
              TBuf<160> iMessage;
              TInt iOneShotScan;
              TUint iPadMask;
              TUint iHwFire;
              TUint iLastPadMask;
              TPointerState iPtr[KMaxPtr];
              TPending iPending[KMaxPending];
              TUint iKeyDownTick[256];

              // layout
              TPoint iDpadC;
              TInt iDpadR;
              TPoint iBtnA, iBtnB;
              TInt iBtnR;
              TRect iBtnKbd, iBtnMenu;
              TRect iKbdArea;
              TRect iMenuItem[6];
              };

          class CCapAppUi : public CAknAppUi
              {
          public:
              void ConstructL();
              ~CCapAppUi();
              void HandleCommandL(TInt aCommand);
              void HandleForegroundEventL(TBool aForeground);
              void HandleResourceChangeL(TInt aType);
          private:
              CCapContainer* iContainer;
              };

          class CCapDocument : public CAknDocument
              {
          public:
              CCapDocument(CEikApplication& aApp) : CAknDocument(aApp) {}
          private:
              CEikAppUi* CreateAppUiL();
              };

          class CCapApplication : public CAknApplication
              {
          private:
              CApaDocument* CreateDocumentL();
              TUid AppDllUid() const;
              };

          extern CCapContainer* gCapContainer;

          #endif
          CAP32_EOF
          mkdir -p symbian/app/sis
          cat > symbian/app/sis/cap32.pkg <<'CAP32_EOF'
          ; Caprice32 for Symbian^3 - install package (paths are expanded by package-sis.sh)
          &EN
          #{"Caprice32"},(0xE1A5C032),1,0,0
          %{"Caprice32 team / Symbian port"}
          :"Symbian port"
          [0x20022E6D], 0, 0, 0, {"S60ProductID"}
          [0x1028315F], 0, 0, 0, {"S60ProductID"}
          [0x102752AE], 0, 0, 0, {"S60ProductID"}
          [0x102032BE], 0, 0, 0, {"S60ProductID"}
          [0x101F7961], 0, 0, 0, {"S60ProductID"}
          "$(epocroot)epoc32/release/$(platform)/$(target)/cap32.exe"-"!:\sys\bin\cap32.exe"
          "$(epocroot)epoc32/data/z/resource/apps/cap32.rsc"-"!:\resource\apps\cap32.rsc"
          "$(epocroot)epoc32/data/z/private/10003a3f/import/apps/cap32_reg.rsc"-"!:\private\10003a3f\import\apps\cap32_reg.rsc"
          ; default configuration and the bundled ROMs (copied by the workflow into app/sis/payload)
          "payload/cap32.cfg"-"!:\caprice32\cap32.cfg"
          "payload/cpc6128.rom"-"!:\caprice32\rom\cpc6128.rom"
          "payload/cpc664.rom"-"!:\caprice32\rom\cpc664.rom"
          "payload/cpc464.rom"-"!:\caprice32\rom\cpc464.rom"
          "payload/amsdos.rom"-"!:\caprice32\rom\amsdos.rom"
          CAP32_EOF
          mkdir -p symbian/app/src
          cat > symbian/app/src/cap32_app.cpp <<'CAP32_EOF'
          // Application / document / AppUi / entry point.
          #include <eikstart.h>
          #include <avkon.hrh>
          #include <eikon.hrh>
          #include <eikenv.h>
          #include <eikspane.h>
          #include <eikbtgpc.h>
          #include "cap32app.h"
          #include "cap32_log.h"

          CApaDocument* CCapApplication::CreateDocumentL() { return new (ELeave) CCapDocument(*this); }
          TUid CCapApplication::AppDllUid() const { return KUidCap32; }
          CEikAppUi* CCapDocument::CreateAppUiL() { return new (ELeave) CCapAppUi; }

          void CCapAppUi::ConstructL()
              {
              caplog("AppUi: BaseConstructL");
              BaseConstructL(CAknAppUi::EAknEnableSkin);
              caplog("AppUi: SetOrientationL");
              SetOrientationL(CAknAppUiBase::EAppUiOrientationLandscape);
              CEikStatusPane* sp = StatusPane();
              if (sp) { sp->MakeVisible(EFalse); }
              CEikButtonGroupContainer* cba = Cba();
              if (cba) { cba->MakeVisible(EFalse); }
              caplog("AppUi: creating the container");
              TRAPD(err, iContainer = CCapContainer::NewL(ApplicationRect()));
              if (err != KErrNone) { caplog_i("AppUi: container NewL LEFT with", err); User::Leave(err); }
              caplog("AppUi: AddToStackL");
              AddToStackL(iContainer);
              caplog("AppUi: ready");
              }

          CCapAppUi::~CCapAppUi()
              {
              caplog("AppUi: destructor");
              if (iContainer)
                  {
                  RemoveFromStack(iContainer);
                  delete iContainer;
                  iContainer = NULL;
                  }
              }

          void CCapAppUi::HandleCommandL(TInt aCommand)
              {
              caplog_i("AppUi: HandleCommandL command", aCommand);
              switch (aCommand)
                  {
                  case EEikCmdExit:
                  case EAknSoftkeyExit:
                  case EAknCmdExit:
                      // The emulator loop runs inside a nested scheduler, so ask it to quit cleanly
                      // (it saves the config, then terminates the process).
                      if (iContainer) { iContainer->RequestQuit(); } else { Exit(); }
                      break;
                  default:
                      break;
                  }
              }

          void CCapAppUi::HandleForegroundEventL(TBool aForeground)
              {
              caplog_i("AppUi: foreground", (int)aForeground);
              CAknAppUi::HandleForegroundEventL(aForeground);
              if (iContainer) { iContainer->SetForeground(aForeground); }
              }

          void CCapAppUi::HandleResourceChangeL(TInt aType)
              {
              caplog_i("AppUi: HandleResourceChangeL type", aType);
              CAknAppUi::HandleResourceChangeL(aType);
              if (iContainer && aType == KEikDynamicLayoutVariantSwitch)
                  {
                  iContainer->SetRect(ApplicationRect());
                  }
              }

          LOCAL_C CApaApplication* NewApplication() { return new CCapApplication; }

          GLDEF_C TInt E32Main()
              {
              caplog_start();
              caplog("E32Main: RunApplication");
              TInt r = EikStart::RunApplication(NewApplication);
              caplog_i("E32Main: RunApplication returned", r);
              return r;
              }
          CAP32_EOF
          mkdir -p symbian/app/src
          cat > symbian/app/src/cap32_audio.cpp <<'CAP32_EOF'
          // Audio output: CMdaAudioOutputStream fed from the core's SDL-style audio callback.
          #include <hal.h>
          #include "cap32app.h"
          #include "lite_hooks.h"
          #include "cap32_log.h"

          CCapAudio* gCapAudio = NULL;

          static TInt RateConst(TInt aHz)
              {
              // TMdaAudioDataSettings::ESampleRate* values
              switch (aHz)
                  {
                  case 8000:  return 0x00000001;
                  case 11025: return 0x00000002;
                  case 16000: return 0x00000004;
                  case 22050: return 0x00000008;
                  case 32000: return 0x00000010;
                  case 44100: return 0x00000020;
                  case 48000: return 0x00000040;
                  default:    return 0x00000008;
                  }
              }

          CCapAudio* CCapAudio::NewL(TInt aRate, TInt aChannels, TInt aSlotBytes)
              {
              CCapAudio* self = new (ELeave) CCapAudio;
              CleanupStack::PushL(self);
              self->ConstructL(aRate, aChannels, aSlotBytes);
              CleanupStack::Pop(self);
              return self;
              }

          CCapAudio::CCapAudio() {}

          CCapAudio::~CCapAudio()
              {
              if (iStream) { iStream->Stop(); delete iStream; }
              for (TInt i = 0; i < KSlots; ++i) { delete iBuf[i]; }
              }

          void CCapAudio::ConstructL(TInt aRate, TInt aChannels, TInt aSlotBytes)
              {
              iRate = aRate; iChannels = aChannels; iSlotBytes = aSlotBytes;
              iOpenTick = lite_ticks();
              iLastAct = iOpenTick;
              for (TInt i = 0; i < KSlots; ++i)
                  {
                  iBuf[i] = HBufC8::NewL(aSlotBytes);
                  iBusy[i] = EFalse;
                  }
              iStream = CMdaAudioOutputStream::NewL(*this);
              iStream->Open(NULL);
              }

          void CCapAudio::MaoscOpenComplete(TInt aError)
              {
              if (aError != KErrNone) { caplog_i("Audio: open failed", aError); iFailed = ETrue; return; }
              caplog("Audio: stream opened");
              TRAPD(err, iStream->SetAudioPropertiesL(RateConst(iRate), iChannels == 2 ? 2 : 1));
              if (err != KErrNone) { caplog_i("Audio: SetAudioPropertiesL failed", err); iFailed = ETrue; return; }
              iStream->SetVolume(iStream->MaxVolume() / 2);
              iStream->SetPriority(EPriorityNormal, EMdaPriorityPreferenceTime);
              iReady = ETrue;
              }

          void CCapAudio::MaoscBufferCopied(TInt aError, const TDesC8& aBuffer)
              {
              if (aError != KErrNone && aError != KErrCancel) { caplog_i("Audio: buffer error", aError); iFailed = ETrue; }
              iLastAct = lite_ticks();
              for (TInt i = 0; i < KSlots; ++i)
                  {
                  if (iBuf[i]->Ptr() == aBuffer.Ptr()) { iBusy[i] = EFalse; }
                  }
              }

          void CCapAudio::MaoscPlayComplete(TInt aError)
              {
              if (aError != KErrNone && aError != KErrCancel) { caplog_i("Audio: play complete error", aError); iFailed = ETrue; }
              for (TInt i = 0; i < KSlots; ++i) { iBusy[i] = EFalse; }
              }

          TBool CCapAudio::CanWrite()
              {
              TUint now = lite_ticks();
              if (!iReady)
                  {
                  // No audio device (or still opening for too long): keep the emulator paced silently,
                  // one buffer per period, so it never stalls waiting for the stream.
                  if (iFailed || now - iOpenTick > 3000)
                      {
                      if (iNextFake == 0 || now - iNextFake > 1000) { iNextFake = now; }
                      if (now >= iNextFake) { return ETrue; }
                      }
                  return EFalse;
                  }
              for (TInt i = 0; i < KSlots; ++i) { if (!iBusy[i]) { return ETrue; } }
              // Every slot is queued and the stream has returned none for a long time (the device took the audio
              // resource, the stream stalled, an underflow without a callback): the core waits for a played buffer
              // forever and the emulator looks frozen.  Give the stream up and fall back to silent pacing.
              if (now - iLastAct > 700)
                  {
                  caplog_i("Audio: stream stalled, falling back to silent pacing, ms", (int)(now - iLastAct));
                  iStream->Stop();
                  for (TInt i = 0; i < KSlots; ++i) { iBusy[i] = EFalse; }
                  iReady = EFalse;
                  iFailed = ETrue;
                  iNextFake = 0;
                  }
              return EFalse;
              }

          TBool CCapAudio::Write(const TUint8* aData, TInt aLen)
              {
              if (!iReady)
                  {
                  // fake pacing: one period of audio
                  TInt bytesPerSec = iRate * iChannels * 2;
                  iNextFake += (bytesPerSec > 0) ? (TUint)(aLen * 1000 / bytesPerSec) : 20;
                  return ETrue;
                  }
              if (aLen > iSlotBytes) { aLen = iSlotBytes; }
              for (TInt i = 0; i < KSlots; ++i)
                  {
                  if (!iBusy[i])
                      {
                      TPtr8 p = iBuf[i]->Des();
                      p.Copy(aData, aLen);
                      iBusy[i] = ETrue;
                      { TBool any = EFalse; for (TInt k = 0; k < KSlots; ++k) { if (iBusy[k] && k != i) { any = ETrue; } }
                        if (!any) { iLastAct = lite_ticks(); } }   // the stream was idle: the stall timer starts now
                      TRAPD(err, iStream->WriteL(*iBuf[i]));
                      if (err != KErrNone) { iBusy[i] = EFalse; return EFalse; }
                      return ETrue;
                      }
                  }
              return EFalse;
              }

          void CCapAudio::Pause(TBool aPaused) { iPaused = aPaused; }

          // ---- hooks used by the core ----
          extern "C" int lite_audio_open(int freq, int channels, int bits, int samples)
              {
              if (gCapAudio) { return 1; }
              caplog_i("Audio: lite_audio_open, rate", freq);
              TRAPD(err, gCapAudio = CCapAudio::NewL(freq, channels, samples * channels * (bits / 8)));
              if (err != KErrNone) { caplog_i("Audio: NewL LEFT with", err); gCapAudio = NULL; return 0; }
              return 1;
              }
          extern "C" int lite_audio_can_write(void) { return gCapAudio ? gCapAudio->CanWrite() : 0; }
          extern "C" int lite_audio_write(const unsigned char* d, int n) { caplog_fast("Audio: write"); return gCapAudio ? gCapAudio->Write(d, n) : 0; }
          extern "C" void lite_audio_close(void) { delete gCapAudio; gCapAudio = NULL; }
          extern "C" void lite_audio_pause(int p) { if (gCapAudio) { gCapAudio->Pause(p); } }
          CAP32_EOF
          mkdir -p symbian/app/src
          cat > symbian/app/src/cap32_container.cpp <<'CAP32_EOF'
          // Main control: hosts the emulator loop (nested active scheduler), draws the frame, handles
          // touch (multi-pointer pad / fire buttons / on-screen CPC keyboard / menu) and hardware keys.
          #include <aknutils.h>
          #include <avkon.hrh>
          #include <eikon.hrh>
          #include <eikenv.h>
          #include <e32keys.h>
          #include <string.h>
          #include "SDL_scancode.h"
          #include "SDL_keycode.h"
          #include "lite_hooks.h"
