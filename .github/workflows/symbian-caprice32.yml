          int sscanf(const char*, const char*, ...) { return 0; }   // only used by optional debug paths

          // ---------------------------------------------------------------- FILE
          struct cp_FILE { int h; int err; int eof; int wr; unsigned char* buf; int bpos; int blen; int ungot; int fdidx; };
          #define CP_BUF 4096
          static cp_FILE g_in = { -1, 0, 0, 0, 0, 0, 0, -1, -1 }, g_out = { -1, 0, 0, 0, 0, 0, 0, -1, -1 }, g_err = { -1, 0, 0, 0, 0, 0, 0, -1, -1 };
          FILE* cp_stdin = &g_in; FILE* cp_stdout = &g_out; FILE* cp_stderr = &g_err;
          #define CP_MAXFD 32
          static cp_FILE* g_fds[CP_MAXFD];

          static int fl(cp_FILE* f) { // flush write buffer
            if (f->wr && f->blen > 0) { long w = plat_write(f->h, f->buf, f->blen); f->blen = 0; if (w < 0) { f->err = 1; return -1; } }
            return 0;
          }
          static void drop_read(cp_FILE* f) { // discard read-ahead, restoring the logical file position
            if (!f->wr && f->blen > f->bpos) plat_seek(f->h, -(long)(f->blen - f->bpos), 1);
            if (!f->wr) { f->bpos = f->blen = 0; }
            f->ungot = -1;
          }
          FILE* fopen(const char* path, const char* mode) {
            int m = mode[0] == 'r' ? 0 : mode[0] == 'w' ? 1 : 2;
            if (m == 0 && strchr(mode, '+')) m = 0;
            int h = plat_open(path, m); if (h < 0) { g_errno = ENOENT; return 0; }
            cp_FILE* f = (cp_FILE*)calloc(1, sizeof(cp_FILE)); f->h = h; f->wr = m != 0; f->buf = (unsigned char*)malloc(CP_BUF); f->ungot = -1; f->fdidx = -1;
            return f;
          }
