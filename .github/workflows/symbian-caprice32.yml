              if (!d) { delete list; return NULL; }
              d->iList = list; d->iIdx = 0;
              return d;
              }

          int plat_readdir(void* dir, char* name, int namelen, int* isdir)
              {
              TPlatDir* d = (TPlatDir*)dir;
              if (d->iIdx >= d->iList->Count()) { return 0; }
              const TEntry& e = (*d->iList)[d->iIdx++];
              TInt i = 0;
              for (; i < e.iName.Length() && i < namelen - 1; ++i)
                  {
                  TUint c = e.iName[i];
                  name[i] = (char)(c < 128 ? c : '?');
                  }
              name[i] = 0;
              *isdir = e.IsDir() ? 1 : 0;
              return 1;
              }

          void plat_closedir(void* dir) { TPlatDir* d = (TPlatDir*)dir; delete d->iList; User::Free(d); }

          void plat_sleep_ms(int ms) { if (ms > 0) { User::After(TTimeIntervalMicroSeconds32(ms * 1000)); } }

          static TInt gTickUs = 0;
          unsigned int plat_ticks(void)
              {
              if (gTickUs == 0)
                  {
                  TInt p = 1000;
                  if (HAL::Get(HAL::ENanoTickPeriod, p) != KErrNone || p <= 0) { p = 1000; }
                  gTickUs = p;
                  }
              return (unsigned int)(((TUint64)User::NTickCount() * (TUint)gTickUs) / 1000u);
              }

          long plat_time(void)
              {
              TTime now; now.UniversalTime();
              TTime epoch(TDateTime(1970, EJanuary, 0, 0, 0, 0, 0));
              TTimeIntervalSeconds s;
              if (now.SecondsFrom(epoch, s) != KErrNone) { return 0; }
              return s.Int();
              }

