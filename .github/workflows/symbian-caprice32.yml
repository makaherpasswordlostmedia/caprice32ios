              if (gFile[h].Read(d) != KErrNone) { return -1; }
              return d.Length();
              }

          long plat_write(int h, const void* buf, long n)
              {
              TPtrC8 d((const TUint8*)buf, (TInt)n);
              if (gFile[h].Write(d) != KErrNone) { return -1; }
              return n;
              }

