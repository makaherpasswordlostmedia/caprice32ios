          void lite_pump(int ms) { if (ms > 0) plat_sleep_ms(ms); }
          int lite_audio_open(int, int, int, int) { return 1; }
          static unsigned g_nextAudio = 0;
          int lite_audio_can_write(void) { unsigned t = plat_ticks(); if (t >= g_nextAudio) { g_nextAudio = (g_nextAudio ? g_nextAudio : t) + 20; return 1; } return 0; }
          int lite_audio_write(const unsigned char*, int) { return 1; }
          void lite_audio_close(void) {}
          void lite_audio_pause(int) {}
          unsigned lite_ticks(void) { return plat_ticks(); }
          void lite_toggle_keyboard(void) {}
          }
          int main(int argc, char** argv) {
            if (argc > 1) g_max = atoi(argv[1]);
            const char* rd = argc > 2 ? argv[2] : "."; setenv("HOME", rd, 1);
            if (chdir(rd) != 0) return 3;
            char* av[] = { (char*)"cap32", 0 };
            return cap32_main(1, av);
          }
