          // ------------------------------------------------------------------ pump helpers
          class CCapPump : public CTimer
              {
          public:
              static CCapPump* NewL(CCapContainer* aOwner)
                  {
                  CCapPump* s = new (ELeave) CCapPump(aOwner);
                  CleanupStack::PushL(s);
                  s->ConstructL();
                  CleanupStack::Pop(s);
                  return s;
                  }
          private:
              CCapPump(CCapContainer* aOwner) : CTimer(CActive::EPriorityStandard), iOwner(aOwner) { CActiveScheduler::Add(this); }
              void RunL() { iOwner->PumpDone(); }
              CCapContainer* iOwner;
              };

          class CCapIdle : public CIdle
              {
          public:
              static CCapIdle* NewL(CCapContainer* aOwner)
                  {
                  CCapIdle* s = new (ELeave) CCapIdle(aOwner);
                  return s;
                  }
              void Kick() { Start(TCallBack(Cb, iOwner)); }
          private:
              CCapIdle(CCapContainer* aOwner) : CIdle(CActive::EPriorityIdle), iOwner(aOwner) { CActiveScheduler::Add(this); }
              static TInt Cb(TAny* aPtr) { ((CCapContainer*)aPtr)->PumpDone(); return 0; }
              CCapContainer* iOwner;
              };

