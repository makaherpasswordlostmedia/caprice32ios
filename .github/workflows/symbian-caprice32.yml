              {
              TInt pos = (TInt)off;
              TSeek m = (whence == 0) ? ESeekStart : (whence == 1) ? ESeekCurrent : ESeekEnd;
              if (gFile[h].Seek(m, pos) != KErrNone) { return -1; }
              return pos;
              }

