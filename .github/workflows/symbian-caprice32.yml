          static const GLenum kTex2D = 0x0DE1, kMinF = 0x2801, kMagF = 0x2800, kWrapS = 0x2802, kWrapT = 0x2803;
          static const GLint kNearest = 0x2600, kClamp = 0x812F;
          static const GLenum kRGBA = 0x1908, kUByte = 0x1401, kFloat = 0x1406, kTriStrip = 5, kColorBit = 0x4000;
