          // "E:/caprice32//rom/x" -> "E:\caprice32\rom\x"; relative paths are resolved against the core's cwd.
          static void Conv(const char* aPath, TFileName& aOut)
              {
              aOut.Zero();
              char cwd[260];
              if (aPath[0] == 0 || aPath[1] != ':')
                  {
                  if (getcwd(cwd, sizeof(cwd)))
                      {
                      for (const char* c = cwd; *c && aOut.Length() < KMaxFileName - 2; ++c)
                          {
                          aOut.Append((TChar)(*c == '/' ? '\\' : *c));
                          }
                      }
                  if (aPath[0] == '/') { aPath++; }
                  }
              TBool lastSlash = (aOut.Length() > 0 && aOut[aOut.Length() - 1] == '\\');
              for (const char* c = aPath; *c && aOut.Length() < KMaxFileName - 2; ++c)
                  {
                  if (*c == '/' || *c == '\\')
                      {
                      if (lastSlash) { continue; }
                      aOut.Append((TChar)'\\');
                      lastSlash = ETrue;
                      }
                  else
                      {
                      aOut.Append((TChar)(TUint8)*c);
                      lastSlash = EFalse;
                      }
                  }
              }

