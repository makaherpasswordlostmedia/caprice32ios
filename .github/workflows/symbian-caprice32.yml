          // ---------------------------------------------------------------- printf
          struct Out { char* b; size_t cap; size_t n; };
          static void oc(Out& o, char c) { if (o.n + 1 < o.cap) o.b[o.n] = c; ++o.n; }
          static void pad(Out& o, int n, char c) { while (n-- > 0) oc(o, c); }
          static void fmt_uint(Out& o, unsigned long long v, int base, int upper, int neg, int width, int prec, int left, int zero, int plus, int space) {
            char t[72]; int n = 0; const char* dg = upper ? "0123456789ABCDEF" : "0123456789abcdef";
            if (v == 0 && prec != 0) t[n++] = '0';
            while (v) { t[n++] = dg[v % base]; v /= base; }
            while (n < prec) t[n++] = '0';
            char sign = neg ? '-' : plus ? '+' : space ? ' ' : 0;
            int total = n + (sign ? 1 : 0);
            if (!left && !zero) pad(o, width - total, ' ');
            if (sign) oc(o, sign);
            if (!left && zero && prec < 0) pad(o, width - total, '0');
            while (n) oc(o, t[--n]);
            if (left) pad(o, width - total, ' ');
          }
          int vsnprintf(char* buf, size_t cap, const char* f, va_list ap) {
            Out o = { buf, cap, 0 };
            for (; *f; ++f) {
              if (*f != '%') { oc(o, *f); continue; }
              ++f; int left = 0, zero = 0, plus = 0, space = 0, alt = 0, width = 0, prec = -1, lng = 0, sz = 0;
              for (;; ++f) { if (*f == '-') left = 1; else if (*f == '0') zero = 1; else if (*f == '+') plus = 1; else if (*f == ' ') space = 1; else if (*f == '#') alt = 1; else break; }
              if (*f == '*') { width = va_arg(ap, int); if (width < 0) { left = 1; width = -width; } ++f; } else while (*f >= '0' && *f <= '9') width = width * 10 + (*f++ - '0');
              if (*f == '.') { ++f; prec = 0; if (*f == '*') { prec = va_arg(ap, int); ++f; } else while (*f >= '0' && *f <= '9') prec = prec * 10 + (*f++ - '0'); }
              for (;; ++f) { if (*f == 'l') ++lng; else if (*f == 'z' || *f == 't' || *f == 'j') sz = 1; else if (*f == 'h') {} else break; }
              char c = *f; if (!c) break;
              switch (c) {
                case '%': oc(o, '%'); break;
                case 'c': { char ch = (char)va_arg(ap, int); if (!left) pad(o, width - 1, ' '); oc(o, ch); if (left) pad(o, width - 1, ' '); break; }
                case 's': { const char* s = va_arg(ap, const char*); if (!s) s = "(null)"; int l = (int)strlen(s); if (prec >= 0 && l > prec) l = prec; if (!left) pad(o, width - l, ' '); for (int i = 0; i < l; ++i) oc(o, s[i]); if (left) pad(o, width - l, ' '); break; }
                case 'd': case 'i': { long long v = lng >= 2 ? va_arg(ap, long long) : lng || sz ? va_arg(ap, long) : va_arg(ap, int); fmt_uint(o, v < 0 ? (unsigned long long)-v : (unsigned long long)v, 10, 0, v < 0, width, prec, left, zero, plus, space); break; }
                case 'u': case 'x': case 'X': case 'o': { unsigned long long v = lng >= 2 ? va_arg(ap, unsigned long long) : lng || sz ? va_arg(ap, unsigned long) : va_arg(ap, unsigned);
                  if (alt && (c == 'x' || c == 'X') && v) { oc(o, '0'); oc(o, c); }
                  fmt_uint(o, v, c == 'u' ? 10 : c == 'o' ? 8 : 16, c == 'X', 0, width, prec, left, zero, 0, 0); break; }
                case 'p': { unsigned long v = (unsigned long)va_arg(ap, void*); oc(o, '0'); oc(o, 'x'); fmt_uint(o, v, 16, 0, 0, 0, -1, 0, 0, 0, 0); break; }
                case 'f': case 'F': case 'g': case 'G': case 'e': case 'E': {
                  double d = va_arg(ap, double); int neg = d < 0; if (neg) d = -d; int pr = prec < 0 ? 6 : prec;
                  if (c == 'g' || c == 'G' || c == 'e' || c == 'E') { if (prec < 0) pr = 4; }
                  double r = 0.5; for (int i = 0; i < pr; ++i) r /= 10; d += r;
                  unsigned long long ip = (unsigned long long)d; double fp = d - (double)ip;
                  char t[48]; int n = 0; unsigned long long v = ip; if (!v) t[n++] = '0'; while (v) { t[n++] = (char)('0' + v % 10); v /= 10; }
                  char fr[24]; int fn = 0; for (int i = 0; i < pr && fn < 20; ++i) { fp *= 10; int dd = (int)fp; fr[fn++] = (char)('0' + dd); fp -= dd; }
                  if (c == 'g' || c == 'G') while (fn > 0 && fr[fn - 1] == '0') --fn;
                  int total = n + (fn || alt ? fn + 1 : 0) + (neg || plus ? 1 : 0);
                  if (!left && !zero) pad(o, width - total, ' ');
                  if (neg) oc(o, '-'); else if (plus) oc(o, '+');
                  if (!left && zero) pad(o, width - total, '0');
                  while (n) oc(o, t[--n]); if (fn || alt) { oc(o, '.'); for (int i = 0; i < fn; ++i) oc(o, fr[i]); }
                  if (left) pad(o, width - total, ' '); break; }
