            constexpr pair() : first(), second() {}
            constexpr pair(const A& a, const B& b) : first(a), second(b) {}
            template<class C, class D> constexpr pair(const pair<C, D>& p) : first(p.first), second(p.second) {}
            template<class C, class D> constexpr pair(C&& c, D&& d) : first(forward<C>(c)), second(forward<D>(d)) {}
          };
          template<class A, class B> constexpr bool operator==(const pair<A,B>& x, const pair<A,B>& y) { return x.first == y.first && x.second == y.second; }
          template<class A, class B> constexpr bool operator<(const pair<A,B>& x, const pair<A,B>& y) { return x.first < y.first || (!(y.first < x.first) && x.second < y.second); }
          template<class A, class B> constexpr pair<typename remove_reference<A>::type, typename remove_reference<B>::type> make_pair(A&& a, B&& b) { return pair<typename remove_reference<A>::type, typename remove_reference<B>::type>(forward<A>(a), forward<B>(b)); }
          template<class T> struct less { bool operator()(const T& a, const T& b) const { return a < b; } };
