            size_t size() const { return v.size(); } bool empty() const { return v.empty(); } void clear() { v.clear(); }
            iterator find(const K& k) { size_t i = lb(k); return (i < v.size() && !cmp(k, v[i].first)) ? v.begin() + i : v.end(); }
            const_iterator find(const K& k) const { size_t i = lb(k); return (i < v.size() && !cmp(k, v[i].first)) ? v.begin() + i : v.end(); }
            size_t count(const K& k) const { return find(k) != v.end() ? 1 : 0; }
