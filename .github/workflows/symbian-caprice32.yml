          #include "SDL.h"
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include "cap32.h"
          #include "plat.h"
          static int g_frames = 0, g_max = 300;
          struct KS { int sym, scan, mod; };
          static const KS kSeq[] = { {SDLK_p,SDL_SCANCODE_P,0},{SDLK_r,SDL_SCANCODE_R,0},{SDLK_i,SDL_SCANCODE_I,0},{SDLK_n,SDL_SCANCODE_N,0},{SDLK_t,SDL_SCANCODE_T,0},{SDLK_SPACE,SDL_SCANCODE_SPACE,0},
            {SDLK_6,SDL_SCANCODE_6,0},{SDLK_8,SDL_SCANCODE_8,KMOD_LSHIFT},{SDLK_7,SDL_SCANCODE_7,0},{SDLK_RETURN,SDL_SCANCODE_RETURN,0} };
          static void drive_keys() {
            int f = g_frames - 80; if (f < 0) return; int i = f / 6, ph = f % 6; if (i >= (int)(sizeof kSeq / sizeof kSeq[0])) return;
            const KS& k = kSeq[i];
            if (ph == 0) { if (k.mod) lite_post_key(1, SDL_SCANCODE_LSHIFT, SDLK_LSHIFT, k.mod); lite_post_key(1, k.scan, k.sym, k.mod); }
            if (ph == 3) { lite_post_key(0, k.scan, k.sym, k.mod); if (k.mod) lite_post_key(0, SDL_SCANCODE_LSHIFT, SDLK_LSHIFT, 0); }
          }
          extern "C" {
          void lite_present(const unsigned int* px, int w, int h, int pitch, int,int,int,int,int,int,int,int,int,int) {
            ++g_frames; drive_keys();
            if (g_frames == g_max || g_frames == 1 + g_max / 2) {
              char name[64]; snprintf(name, sizeof name, "frame%d.ppm", g_frames);
              FILE* f = fopen(name, "wb"); fprintf(f, "P6\n%d %d\n255\n", w, h);
              for (int i = 0; i < w * h; ++i) { unsigned char c[3] = { (unsigned char)(px[i] >> 16), (unsigned char)(px[i] >> 8), (unsigned char)px[i] }; fwrite(c, 1, 3, f); }
              fclose(f);
            }
            if (g_frames >= g_max) { const char m[] = "DONE frames\n"; plat_write(2, m, sizeof m - 1); plat_exit(0); }
          }
