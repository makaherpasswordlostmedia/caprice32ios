              delete iPumpTimer;
              delete iPumpIdle;
              }

          void CCapContainer::ConstructL(const TRect& /*aRect*/)
              {
              gCapContainer = this;
              caplog("Container: CreateWindowL");
              CreateWindowL();
              SetExtentToWholeScreen();
          #if USE_MULTITOUCH
              Window().EnableAdvancedPointers();
          #endif
              Window().SetPointerGrab(ETrue);
              EnableDragEvents();
              SetFocusing(ETrue);
              iForeground = ETrue;
              caplog("Container: pump objects");
              iPumpTimer = CCapPump::NewL(this);
              iPumpIdle = CCapIdle::NewL(this);
              for (TInt i = 0; i < KMaxPtr; ++i) { iPtr[i].iDown = EFalse; iPtr[i].iHit = KHitNone; iPtr[i].iMod = 0; }
              for (TInt i = 0; i < KMaxPending; ++i) { iPending[i].iUsed = EFalse; }
              iOneShotScan = -1;
              ComputeLayout();
              caplog("Container: ActivateL");
              ActivateL();
              caplog_i("Container: window width", Size().iWidth);
              caplog_i("Container: window height", Size().iHeight);
              iStartCb = new (ELeave) CAsyncCallBack(TCallBack(StartCb, this), CActive::EPriorityLow);
              iStartCb->CallBack();
              }

          TInt CCapContainer::StartCb(TAny* aPtr)
              {
              ((CCapContainer*)aPtr)->RunEmulator();   // does not return
              return 0;
              }

          // ------------------------------------------------------------------ emulator host
          static TBool RomExists(RFs& aFs, TChar aDrive)
              {
              TFileName n; n.Append(aDrive); n.Append(_L(":\\caprice32\\rom\\cpc6128.rom"));
              TEntry e;
              return aFs.Entry(n, e) == KErrNone;
              }

          void CCapContainer::PrepareStorage(TFileName& aBase)
              {
              RFs fs; fs.Connect();
              const TText kDrives[] = { 'E', 'F', 'G', 'D', 'C', 0 };
              TChar found = 0;
              for (TInt i = 0; kDrives[i]; ++i) { if (RomExists(fs, kDrives[i])) { found = kDrives[i]; break; } }
              if (found == 0)
                  {
                  // no ROMs yet: create the folder structure on the memory card (or phone memory) so the user can copy them
                  TChar d = 'E';
                  TDriveInfo di;
                  if (fs.Drive(di, EDriveE) != KErrNone || di.iType == EMediaNotPresent) { d = 'C'; }
                  aBase.Zero(); aBase.Append(d);
                  aBase.Append(d == 'C' ? _L(":\\Data\\caprice32\\rom\\") : _L(":\\caprice32\\rom\\"));
                  fs.MkDirAll(aBase);
                  aBase.Zero(); aBase.Append(d);
                  aBase.Append(d == 'C' ? _L(":\\Data\\caprice32\\") : _L(":\\caprice32\\"));
                  fs.Close();
                  return;
                  }
              aBase.Zero(); aBase.Append(found); aBase.Append(_L(":\\caprice32\\"));
              fs.MkDirAll(aBase);
              fs.Close();
              }

          static TBool HasExt(const TDesC& aName)
              {
              static const TText* const kExt[] = { _S(".dsk"), _S(".cdt"), _S(".voc"), _S(".sna"), _S(".cpr"), 0 };
              for (TInt i = 0; kExt[i]; ++i)
                  {
                  TPtrC e(kExt[i]);
                  if (aName.Length() > e.Length() && aName.Right(e.Length()).CompareF(e) == 0) { return ETrue; }
                  }
              return EFalse;
              }

          void CCapContainer::FindNewest(const TDesC& aDir, TFileName& aBest, TTime& aBestTime)
              {
              RFs fs; if (fs.Connect() != KErrNone) { return; }
              TFileName pat(aDir); pat.Append(_L("*"));
              CDir* list = NULL;
              if (fs.GetDir(pat, KEntryAttNormal, ESortByDate | EDescending, list) == KErrNone && list)
                  {
                  for (TInt i = 0; i < list->Count(); ++i)
                      {
                      const TEntry& e = (*list)[i];
                      if (HasExt(e.iName) && (aBest.Length() == 0 || e.iModified > aBestTime))
                          {
                          aBest.Zero(); aBest.Append(aDir); aBest.Append(e.iName); aBestTime = e.iModified;
                          }
                      }
                  delete list;
                  }
              fs.Close();
              }

          static void ToNarrow(const TDesC& aIn, char* aOut, TInt aMax)
              {
              TInt n = 0;
              for (TInt i = 0; i < aIn.Length() && n < aMax - 1; ++i)
                  {
                  TUint c = aIn[i];
                  aOut[n++] = (char)(c == '\\' ? '/' : (c < 128 ? c : '_'));
                  }
              aOut[n] = 0;
              }

          void CCapContainer::ShowMessage(const TDesC& aMsg)
              {
              iMessage.Copy(aMsg.Left(iMessage.MaxLength()));
              Refresh();
              }

          void CCapContainer::RunEmulator()
              {
              iStarted = ETrue;
              caplog("RunEmulator: PrepareStorage");
              TFileName base;
              PrepareStorage(base);
              { TBuf8<KMaxFileName> b8log; b8log.Copy(base); b8log.Append(TChar(0)); caplog_s("RunEmulator: base folder", (const char*)b8log.Ptr()); }

              TFileName romCheck(base); romCheck.Append(_L("rom\\cpc6128.rom"));
              RFs fs; fs.Connect();
              TEntry re;
              TBool haveRom = (fs.Entry(romCheck, re) == KErrNone);
              fs.Close();
              caplog_i("RunEmulator: cpc6128.rom present", (int)haveRom);
              if (!haveRom)
                  {
                  TFileName m(_L("Copy the CPC ROM files (cpc6128.rom, amsdos.rom ...) to "));
                  m.Append(base); m.Append(_L("rom\\ and restart"));
                  ShowMessage(m);
                  while (!iQuit) { Pump(100); }
                  User::Exit(0);
                  }

              static char b8[300], arg0[320], argCfg[320], argSlot[320];
              ToNarrow(base, b8, sizeof(b8));
              strcpy(arg0, b8); strcat(arg0, "cap32");
              strcpy(argCfg, b8); strcat(argCfg, "cap32.cfg");
              TInt bl = strlen(b8);
              char home[300]; strcpy(home, b8); if (bl > 0 && home[bl - 1] == '/') { home[bl - 1] = 0; }
              setenv("HOME", home, 1);
              chdir(b8);

              // newest disk / tape / snapshot image in the base folder (or its disks\ subfolder)
              TFileName best; TTime bestTime(0);
              FindNewest(base, best, bestTime);
              TFileName sub(base); sub.Append(_L("disks\\"));
              FindNewest(sub, best, bestTime);

              char* argv[8]; TInt argc = 0;
              argv[argc++] = arg0;
              argv[argc++] = (char*)"-c";
              argv[argc++] = argCfg;
              if (best.Length() > 0) { ToNarrow(best, argSlot, sizeof(argSlot)); argv[argc++] = argSlot; }
              argv[argc] = 0;

              for (TInt i = 0; i < argc; ++i) { caplog_s("RunEmulator: arg", argv[i]); }
              caplog_mem("before core");
              caplog("RunEmulator: cap32_main_c");
              cap32_main_c(argc, argv);
              caplog("RunEmulator: cap32_main_c returned");
              User::Exit(0);
              }

          void CCapContainer::PrepareExit()
              {
              // The core calls exit() from inside the emulator loop, which ends in User::Exit().  Killing the process
              // with a live EGL context/surface and an open audio stream crashes on exit (the log stops right after
              // "plat_exit"), so release them first, in the right order.
              caplog("EXIT: PrepareExit begin");
              iQuit = ETrue;
              caplog("EXIT: cancel pump timer");
              if (iPumpTimer) { iPumpTimer->Cancel(); }
              caplog("EXIT: cancel pump idle");
              if (iPumpIdle) { iPumpIdle->Cancel(); }
              caplog("EXIT: cancel start callback");
              if (iStartCb) { iStartCb->Cancel(); }
              caplog("EXIT: stop nested wait");
              if (iWait.IsStarted()) { iWait.AsyncStop(); }
              caplog_i("EXIT: foreground flag", (int)iForeground);
              if (iForeground)
                  {
                  caplog("EXIT: ShutdownGl");
                  ShutdownGl();
                  }
              else
                  {
                  // The exit command came while the app was in the background (task switcher / red key).  The GPU surface
                  // is not ours then and any GL/EGL call can hang or crash the driver, so touch no GL at all: the kernel
                  // frees the context when the process ends.
                  caplog("EXIT: in background, GL teardown skipped on purpose");
                  delete iOvlGc;  iOvlGc = NULL;
                  delete iOvlDev; iOvlDev = NULL;
                  delete iOvlBmp; iOvlBmp = NULL;
                  iGlState = 2;
                  }
              caplog("EXIT: hide window");
              MakeVisible(EFalse);
              caplog("EXIT: WsSession flush");
              CEikonEnv* env = CEikonEnv::Static();
              if (env) { env->WsSession().Flush(); }
              caplog("EXIT: PrepareExit done");
              }

          extern "C" void lite_app_teardown(void)
              {
              caplog("EXIT: teardown begin");
              if (gCapAudio) { caplog("EXIT: closing audio"); delete gCapAudio; gCapAudio = NULL; caplog("EXIT: audio closed"); }
              else { caplog("EXIT: audio already closed"); }
              if (gCapContainer) { gCapContainer->PrepareExit(); }
              else { caplog("EXIT: no container"); }
              caplog("EXIT: teardown end");
              }

          void CCapContainer::RequestQuit()
              {
              caplog_i("Container: RequestQuit, emulator started", (int)iStarted);
              iQuit = ETrue;
              if (iStarted) { lite_post_quit(); }
              else { User::Exit(0); }
              }

          void CCapContainer::SetForeground(TBool aForeground)
              {
              iForeground = aForeground;
              if (iStarted) { lite_post_window(aForeground ? 12 : 13); }
              if (aForeground) { Refresh(); }
              }

          // ------------------------------------------------------------------ nested scheduler pump
          void CCapContainer::PumpDone()
              {
              if (iWait.IsStarted()) { iWait.AsyncStop(); }
              }

          extern "C" unsigned int plat_ticks(void);

          static TUint gPresents = 0;
          static TUint gPumps = 0;
          static TUint gHbTick = 0;

          void CCapContainer::Pump(TInt aMs)
              {
              FlushPending();
              if (iPumping) { return; }
              caplog_progress();
              ++gPumps;
              {
                  TUint t = plat_ticks();
                  if (gHbTick == 0) { gHbTick = t; }
                  if (t - gHbTick >= 5000)                // time based: the frame based heartbeat never fired on a slow run
                      {
                      gHbTick = t;
                      caplog_i("alive: presented frames", (int)gPresents);
                      caplog_i("alive: pumps", (int)gPumps);
                      }
              }
              TUint pumpStart = plat_ticks();
              for (;;)
                  {
                  iPumping = ETrue;
                  caplog_progress();
                  caplog_fast(iForeground ? "Pump: waiting in the scheduler" : "Pump: app is in the background, emulator frozen");
                  if (aMs > 0)
                      {
                      iPumpTimer->Cancel();
                      iPumpTimer->After(TTimeIntervalMicroSeconds32(aMs * 1000));
                      }
                  else
                      {
                      iPumpIdle->Cancel();
                      iPumpIdle->Kick();
                      }
                  iWait.Start();
                  iPumping = EFalse;
                  caplog_fast("Pump: returned");
                  if (iForeground || iQuit) { break; }
                  aMs = 100;               // in the background: freeze the emulator until we come back
                  }
              iPumpAcc += plat_ticks() - pumpStart;
              }

          // ------------------------------------------------------------------ frame presentation
          extern "C" unsigned int plat_ticks(void);

          void CCapContainer::Present(const TUint32* aPix, TInt aW, TInt aH, TInt aPitch, const TRect& aSrc)
              {
              if (!iForeground) { return; }
              // Adaptive frame skip. A CPC frame is 20 ms; when emulated frames arrive slower than that, the machine is
              // running below real time, so drop the copy + stretch + overlay redraw of up to 2 frames in 3. That time goes
              // back to the emulation; as soon as it keeps up again every frame is shown.
              TUint now = plat_ticks();
              ++iWinTotal;
              if (iLastFrameTick)
                  {
                  TUint period = now - iLastFrameTick;
                  if (period > 200) { period = 200; }
                  iFramePeriod16 = iFramePeriod16 ? (iFramePeriod16 * 3 + period * 16) / 4 : period * 16;
                  TUint pm = iPumpAcc > 200 ? 200 : iPumpAcc;
                  iPumpMs16 = iPumpMs16 ? (iPumpMs16 * 3 + pm * 16) / 4 : pm * 16;
                  }
              iLastFrameTick = now;
              iPumpAcc = 0;
              caplog_progress();
              caplog_fast("Present: begin");
              ++gPresents;
              ++iWinShown;
              TUint t0 = plat_ticks();
              if (iGlState == 0) { TryInitGl(); }
              if (iGlState == 1) { PresentGl(aPix, aH, aPitch, aSrc); }
              // profiling: D = upload + draw + swap of one frame
              TUint dt = plat_ticks() - t0;
              if (dt > 400) { dt = 400; }
              iDrawMs16 = iDrawMs16 ? (iDrawMs16 * 3 + dt * 16) / 4 : dt * 16;
              if (iWinTotal >= 30)
                  {
                  // per shown frame, in ms: T = time between shown frames, P = spent in Pump() (waiting for the scheduler,
                  // delays), D = uploading + drawing + swapping the picture; T - P - D = the emulator core itself
                  iDbg.Format(_L("T%u P%u D%u"), (iFramePeriod16 + 8) / 16, (iPumpMs16 + 8) / 16, (iDrawMs16 + 8) / 16);
                  iWinTotal = 0; iWinShown = 0;
                  iOverlayDirty = ETrue;
                  }
              }

          TRect CCapContainer::GameRect() const
              {
              TSize s = Rect().Size();
              TInt sw = iSrc.Width() > 0 ? iSrc.Width() : 384, sh = iSrc.Height() > 0 ? iSrc.Height() : 270;
              TInt h = s.iHeight, w = h * sw / sh;
              if (w > s.iWidth) { w = s.iWidth; h = w * sh / sw; }
              TInt x = (s.iWidth - w) / 2, y = (s.iHeight - h) / 2;
              return TRect(x, y, x + w, y + h);
              }

          void CCapContainer::SizeChanged() { ComputeLayout(); }

          void CCapContainer::ComputeLayout()
              {
              TSize s = Rect().Size();
              TInt W = s.iWidth, H = s.iHeight;
              iDpadR = H / 5;
              iDpadC = TPoint(iDpadR + 8, H - iDpadR - 8);
              iBtnR = H / 9;
              iBtnA = TPoint(W - iBtnR - 10, H - iBtnR - 60);
              iBtnB = TPoint(W - iBtnR * 3 - 14, H - iBtnR - 10);
              TInt bw = H / 6, bh = H / 10;
              iBtnMenu = TRect(W - bw, 0, W, bh);
              iBtnKbd = TRect(W - 2 * bw - 4, 0, W - bw - 4, bh);
              TInt kh = H / 9;
              iKbdArea = TRect(0, H - 5 * kh, W, H);
              TInt iw = Min(W - 40, 320), ih = H / 9;
              TInt top = (H - 6 * ih) / 2;
              for (TInt i = 0; i < 6; ++i) { iMenuItem[i] = TRect((W - iw) / 2, top + i * ih, (W + iw) / 2, top + (i + 1) * ih - 4); }
              }

          TRect CCapContainer::KeyRect(TInt aRow, TInt aStartUnits, TInt aWidthUnits, TInt aRowUnits) const
              {
              TInt W = iKbdArea.Width(), kh = iKbdArea.Height() / 5;
              TInt x0 = iKbdArea.iTl.iX + aStartUnits * W / aRowUnits;
              TInt x1 = iKbdArea.iTl.iX + (aStartUnits + aWidthUnits) * W / aRowUnits;
              TInt y0 = iKbdArea.iTl.iY + aRow * kh;
              return TRect(x0 + 1, y0 + 1, x1 - 1, y0 + kh - 1);
              }

          // ------------------------------------------------------------------ drawing
          void CCapContainer::DrawButton(CGraphicsContext& aGc, const TRect& aRect, const TDesC& aLabel, TBool aDown) const
              {
              aGc.SetPenStyle(CGraphicsContext::ESolidPen);
              aGc.SetPenColor(KRgbWhite);
              aGc.SetBrushStyle(CGraphicsContext::ESolidBrush);
              aGc.SetBrushColor(aDown ? TRgb(0x30, 0x60, 0xB0) : TRgb(0x20, 0x20, 0x20));
              aGc.DrawRect(aRect);
              const CFont* f = CEikonEnv::Static()->NormalFont();
              aGc.UseFont(f);
              aGc.DrawText(aLabel, aRect, aRect.Height() / 2 + f->AscentInPixels() / 2, CGraphicsContext::ECenter);
              aGc.DiscardFont();
              }

          void CCapContainer::DrawKeyboard(CGraphicsContext& aGc) const
              {
              for (TInt r = 0; r < 5; ++r)
                  {
                  TInt units = RowUnits(r), u = 0;
                  for (TInt i = 0; i < kRows[r].n; ++i)
                      {
                      const SKey& k = kRows[r].k[i];
                      TBuf<8> lab; lab.Copy(TPtrC8((const TUint8*)k.l));
                      TBool down = (k.sym == SDLK_LSHIFT && iShiftLatch) || (k.sym == SDLK_LCTRL && iCtrlLatch);
                      for (TInt p = 0; p < KMaxPtr && !down; ++p) { if (iPtr[p].iHit == KHitKey + r * 32 + i) { down = ETrue; } }
                      DrawButton(aGc, KeyRect(r, u, k.w, units), lab, down);
                      u += k.w;
                      }
                  }
              }

          void CCapContainer::DrawMenu(CGraphicsContext& aGc) const
              {
              for (TInt i = 0; i < 6; ++i)
                  {
                  TBuf<32> lab; lab.Copy(TPtrC8((const TUint8*)kMenuText[i]));
                  TBool down = EFalse;
                  for (TInt p = 0; p < KMaxPtr; ++p) { if (iPtr[p].iHit == KHitMenuItem + i) { down = ETrue; } }
                  DrawButton(aGc, iMenuItem[i], lab, down);
                  }
              }

          void CCapContainer::DrawPad(CGraphicsContext& aGc) const
              {
              aGc.SetPenStyle(CGraphicsContext::ESolidPen);
              aGc.SetPenColor(TRgb(0xC0, 0xC0, 0xC0));
              aGc.SetBrushStyle(CGraphicsContext::ENullBrush);
              aGc.DrawEllipse(TRect(iDpadC.iX - iDpadR, iDpadC.iY - iDpadR, iDpadC.iX + iDpadR, iDpadC.iY + iDpadR));
              aGc.DrawLine(TPoint(iDpadC.iX - iDpadR, iDpadC.iY), TPoint(iDpadC.iX + iDpadR, iDpadC.iY));
              aGc.DrawLine(TPoint(iDpadC.iX, iDpadC.iY - iDpadR), TPoint(iDpadC.iX, iDpadC.iY + iDpadR));
              // pressed directions
              aGc.SetBrushStyle(CGraphicsContext::ESolidBrush);
              aGc.SetBrushColor(TRgb(0x30, 0x60, 0xB0));
              TInt q = iDpadR / 3;
              if (iPadMask & 1) { aGc.DrawRect(TRect(iDpadC.iX - iDpadR + 4, iDpadC.iY - q, iDpadC.iX - q, iDpadC.iY + q)); }
              if (iPadMask & 2) { aGc.DrawRect(TRect(iDpadC.iX + q, iDpadC.iY - q, iDpadC.iX + iDpadR - 4, iDpadC.iY + q)); }
              if (iPadMask & 4) { aGc.DrawRect(TRect(iDpadC.iX - q, iDpadC.iY - iDpadR + 4, iDpadC.iX + q, iDpadC.iY - q)); }
              if (iPadMask & 8) { aGc.DrawRect(TRect(iDpadC.iX - q, iDpadC.iY + q, iDpadC.iX + q, iDpadC.iY + iDpadR - 4)); }
              aGc.SetBrushStyle(iPadMask & 16 ? CGraphicsContext::ESolidBrush : CGraphicsContext::ENullBrush);
              aGc.DrawEllipse(TRect(iBtnA.iX - iBtnR, iBtnA.iY - iBtnR, iBtnA.iX + iBtnR, iBtnA.iY + iBtnR));
              aGc.SetBrushStyle(iPadMask & 32 ? CGraphicsContext::ESolidBrush : CGraphicsContext::ENullBrush);
              aGc.DrawEllipse(TRect(iBtnB.iX - iBtnR, iBtnB.iY - iBtnR, iBtnB.iX + iBtnR, iBtnB.iY + iBtnR));
              const CFont* f = CEikonEnv::Static()->NormalFont();
              aGc.UseFont(f);
              aGc.SetPenColor(KRgbWhite);
              aGc.DrawText(_L("1"), TRect(iBtnA.iX - iBtnR, iBtnA.iY - iBtnR, iBtnA.iX + iBtnR, iBtnA.iY + iBtnR),
                           iBtnR + f->AscentInPixels() / 2, CGraphicsContext::ECenter);
              aGc.DrawText(_L("2"), TRect(iBtnB.iX - iBtnR, iBtnB.iY - iBtnR, iBtnB.iX + iBtnR, iBtnB.iY + iBtnR),
                           iBtnR + f->AscentInPixels() / 2, CGraphicsContext::ECenter);
              aGc.DiscardFont();
              }

          void CCapContainer::Draw(const TRect& aRect) const
              {
              if (iGlState == 1) { return; }   // OpenGL ES 2 owns the window and draws the picture and the buttons
              // OpenGL ES 2 is not running: only the background, the buttons and the error message
              CWindowGc& gc = SystemGc();
              gc.SetBrushStyle(CGraphicsContext::ESolidBrush);
              gc.SetBrushColor(KRgbBlack);
              gc.SetPenStyle(CGraphicsContext::ENullPen);
              gc.Clear(aRect);
              DrawOverlay(gc);
              }

          void CCapContainer::DrawOverlay(CGraphicsContext& gc) const
              {
              TRect game = GameRect();
              if (iDbg.Length() > 0)
                  {
                  const CFont* df = CEikonEnv::Static()->NormalFont();
                  gc.UseFont(df);
                  gc.SetPenStyle(CGraphicsContext::ESolidPen);
                  gc.SetPenColor(KRgbYellow);
                  gc.DrawText(iDbg, TRect(game.iTl.iX + 4, game.iBr.iY - 24, game.iBr.iX, game.iBr.iY), 18, CGraphicsContext::ELeft);
                  gc.DiscardFont();
                  }
              if (iMessage.Length() > 0)
                  {
                  const CFont* f = CEikonEnv::Static()->NormalFont();
                  gc.UseFont(f);
                  gc.SetPenStyle(CGraphicsContext::ESolidPen);
                  gc.SetPenColor(KRgbWhite);
                  gc.DrawText(iMessage, Rect(), Rect().Height() / 2, CGraphicsContext::ECenter);
                  gc.DiscardFont();
                  }
              if (iMenu) { DrawMenu(gc); }
              else
                  {
                  if (iKeyboard) { DrawKeyboard(gc); } else { DrawPad(gc); }
                  DrawButton(gc, iBtnKbd, _L("KB"), iKeyboard);
                  DrawButton(gc, iBtnMenu, _L("Menu"), EFalse);
                  }
              }


          void CCapContainer::RedrawAll() { iDirty = EFalse; Refresh(); }

          // ------------------------------------------------------------------ input: keys
          void CCapContainer::KeyPress(TInt aScan, TInt aSym, TInt aMod)
              {
              for (TInt i = 0; i < KMaxPending; ++i) { if (iPending[i].iUsed && iPending[i].iScan == aScan) { iPending[i].iUsed = EFalse; lite_post_key(0, aScan, aSym, aMod); } }
              iKeyDownTick[aScan & 255] = lite_ticks();
              lite_post_key(1, aScan, aSym, aMod);
              }

          void CCapContainer::KeyRelease(TInt aScan, TInt aSym, TInt aMod)
              {
              TUint now = lite_ticks();
              TUint due = iKeyDownTick[aScan & 255] + 90;     // hold long enough for the CPC keyboard scan
              if ((TInt)(now - due) >= 0) { lite_post_key(0, aScan, aSym, aMod); return; }
              for (TInt i = 0; i < KMaxPending; ++i)
                  {
                  if (!iPending[i].iUsed)
                      {
                      iPending[i].iUsed = ETrue; iPending[i].iScan = aScan; iPending[i].iSym = aSym; iPending[i].iMod = aMod; iPending[i].iDue = due;
                      return;
                      }
                  }
              lite_post_key(0, aScan, aSym, aMod);
              }

          void CCapContainer::FlushPending()
              {
              TUint now = lite_ticks();
              for (TInt i = 0; i < KMaxPending; ++i)
                  {
                  if (iPending[i].iUsed && (TInt)(now - iPending[i].iDue) >= 0)
                      {
                      iPending[i].iUsed = EFalse;
                      lite_post_key(0, iPending[i].iScan, iPending[i].iSym, iPending[i].iMod);
                      }
                  }
              }

          TBool CCapContainer::MapSymbianKey(TInt aSc, TInt& aScan, TInt& aSym) const
              {
              if (aSc >= 'A' && aSc <= 'Z') { aScan = SDL_SCANCODE_A + (aSc - 'A'); aSym = 'a' + (aSc - 'A'); return ETrue; }
              if (aSc >= '1' && aSc <= '9') { aScan = SDL_SCANCODE_1 + (aSc - '1'); aSym = aSc; return ETrue; }
              switch (aSc)
                  {
                  case '0': aScan = SDL_SCANCODE_0; aSym = SDLK_0; return ETrue;
                  case EStdKeyLeftArrow:  aScan = SDL_SCANCODE_LEFT;  aSym = SDLK_LEFT;  return ETrue;
                  case EStdKeyRightArrow: aScan = SDL_SCANCODE_RIGHT; aSym = SDLK_RIGHT; return ETrue;
                  case EStdKeyUpArrow:    aScan = SDL_SCANCODE_UP;    aSym = SDLK_UP;    return ETrue;
                  case EStdKeyDownArrow:  aScan = SDL_SCANCODE_DOWN;  aSym = SDLK_DOWN;  return ETrue;
                  case EStdKeyEnter:      aScan = SDL_SCANCODE_RETURN; aSym = SDLK_RETURN; return ETrue;
                  case EStdKeyBackspace:  aScan = SDL_SCANCODE_BACKSPACE; aSym = SDLK_BACKSPACE; return ETrue;
                  case EStdKeySpace:      aScan = SDL_SCANCODE_SPACE; aSym = SDLK_SPACE; return ETrue;
                  case EStdKeyTab:        aScan = SDL_SCANCODE_TAB; aSym = SDLK_TAB; return ETrue;
                  case EStdKeyEscape:     aScan = SDL_SCANCODE_ESCAPE; aSym = SDLK_ESCAPE; return ETrue;
                  case EStdKeyLeftShift:
                  case EStdKeyRightShift: aScan = SDL_SCANCODE_LSHIFT; aSym = SDLK_LSHIFT; return ETrue;
                  case EStdKeyLeftCtrl:
                  case EStdKeyRightCtrl:  aScan = SDL_SCANCODE_LCTRL; aSym = SDLK_LCTRL; return ETrue;
                  case EStdKeyComma:      aScan = SDL_SCANCODE_COMMA; aSym = SDLK_COMMA; return ETrue;
                  case EStdKeyFullStop:   aScan = SDL_SCANCODE_PERIOD; aSym = SDLK_PERIOD; return ETrue;
                  case EStdKeyForwardSlash: aScan = SDL_SCANCODE_SLASH; aSym = SDLK_SLASH; return ETrue;
                  case EStdKeySemiColon:  aScan = SDL_SCANCODE_SEMICOLON; aSym = SDLK_SEMICOLON; return ETrue;
                  case EStdKeySingleQuote: aScan = SDL_SCANCODE_APOSTROPHE; aSym = SDLK_QUOTE; return ETrue;
                  case EStdKeyMinus:      aScan = SDL_SCANCODE_MINUS; aSym = SDLK_MINUS; return ETrue;
                  case EStdKeyEquals:     aScan = SDL_SCANCODE_EQUALS; aSym = SDLK_EQUALS; return ETrue;
                  case EStdKeyNkpEnter:   aScan = SDL_SCANCODE_RETURN; aSym = SDLK_RETURN; return ETrue;
                  default: break;
                  }
              return EFalse;
              }

          TKeyResponse CCapContainer::OfferKeyEventL(const TKeyEvent& aKeyEvent, TEventCode aType)
              {
              TInt sc = aKeyEvent.iScanCode;
              if (aType == EEventKeyDown) { caplog_i("key down, scan code", sc); }
              if (aType == EEventKey) { return EKeyWasConsumed; }
              if (aType != EEventKeyDown && aType != EEventKeyUp) { return EKeyWasNotConsumed; }
              TBool down = (aType == EEventKeyDown);
              if (sc == EStdKeyDevice0)          // left soft key: menu
                  {
                  if (down) { iMenu = !iMenu; RedrawAll(); }
                  return EKeyWasConsumed;
                  }
              if (sc == EStdKeyDevice1)          // right soft key: on-screen keyboard
                  {
                  if (down) { ToggleKeyboard(); }
                  return EKeyWasConsumed;
                  }
              if (sc == EStdKeyDevice3)          // d-pad centre: fire 1 (via the joystick pad mask)
                  {
                  iHwFire = down ? 16 : 0;
                  cap32_ios_set_pad(iPadMask | iHwFire);
                  return EKeyWasConsumed;
                  }
              TInt scan, sym;
              if (!MapSymbianKey(sc, scan, sym)) { return EKeyWasNotConsumed; }
              if (down) { KeyPress(scan, sym, 0); } else { KeyRelease(scan, sym, 0); }
              return EKeyWasConsumed;
              }

          void CCapContainer::ToggleKeyboard()
              {
              iKeyboard = !iKeyboard;
              if (!iKeyboard)
                  {
                  if (iShiftLatch) { iShiftLatch = EFalse; lite_post_key(0, SDL_SCANCODE_LSHIFT, SDLK_LSHIFT, 0); }
                  if (iCtrlLatch) { iCtrlLatch = EFalse; lite_post_key(0, SDL_SCANCODE_LCTRL, SDLK_LCTRL, 0); }
                  }
              RedrawAll();
              }
          extern "C" void lite_toggle_keyboard(void) { if (gCapContainer) { gCapContainer->ToggleKeyboard(); } }

          // ------------------------------------------------------------------ input: touch
          TInt CCapContainer::HitTest(const TPoint& aPt) const
              {
              if (iMenu)
                  {
                  for (TInt i = 0; i < 6; ++i) { if (iMenuItem[i].Contains(aPt)) { return KHitMenuItem + i; } }
                  return KHitNone;
                  }
              if (iBtnMenu.Contains(aPt)) { return KHitMenuBtn; }
              if (iBtnKbd.Contains(aPt)) { return KHitKbdBtn; }
              if (iKeyboard)
                  {
                  if (!iKbdArea.Contains(aPt)) { return KHitNone; }
                  for (TInt r = 0; r < 5; ++r)
                      {
                      TInt units = RowUnits(r), u = 0;
                      for (TInt i = 0; i < kRows[r].n; ++i)
                          {
                          if (KeyRect(r, u, kRows[r].k[i].w, units).Contains(aPt)) { return KHitKey + r * 32 + i; }
                          u += kRows[r].k[i].w;
                          }
                      }
                  return KHitNone;
                  }
              TInt dx = aPt.iX - iDpadC.iX, dy = aPt.iY - iDpadC.iY;
              TInt R = iDpadR * 3 / 2;                           // generous touch area around the visible pad
              if (dx * dx + dy * dy <= R * R)
                  {
                  TInt dz = iDpadR / 4, m = 0;
                  if (dx < -dz) { m |= 1; } else if (dx > dz) { m |= 2; }
                  if (dy < -dz) { m |= 4; } else if (dy > dz) { m |= 8; }
                  return KHitPad | m;
                  }
              TInt ax = aPt.iX - iBtnA.iX, ay = aPt.iY - iBtnA.iY, bx = aPt.iX - iBtnB.iX, by = aPt.iY - iBtnB.iY;
              TInt br = iBtnR * 3 / 2;
              if (ax * ax + ay * ay <= br * br) { return KHitFire; }
              if (bx * bx + by * by <= br * br) { return KHitFire + 1; }
              return KHitNone;
              }

          void CCapContainer::OnPress(TInt aHit, TPointerState& aState)
              {
              if (aHit >= KHitKey && aHit < KHitMenuItem)
                  {
                  const SKey& k = kRows[(aHit - KHitKey) / 32].k[(aHit - KHitKey) % 32];
                  if (k.sym == SDLK_LSHIFT)
                      {
                      iShiftLatch = !iShiftLatch;
                      lite_post_key(iShiftLatch, SDL_SCANCODE_LSHIFT, SDLK_LSHIFT, iShiftLatch ? KMOD_LSHIFT : 0);
                      aState.iMod = -1; return;
                      }
                  if (k.sym == SDLK_LCTRL)
                      {
                      iCtrlLatch = !iCtrlLatch;
                      lite_post_key(iCtrlLatch, SDL_SCANCODE_LCTRL, SDLK_LCTRL, iCtrlLatch ? KMOD_LCTRL : 0);
                      aState.iMod = -1; return;
                      }
                  TInt mod = (iShiftLatch ? KMOD_LSHIFT : 0) | (iCtrlLatch ? KMOD_LCTRL : 0);
                  aState.iMod = mod;
                  KeyPress(k.scan, k.sym, mod);
                  }
              else if (aHit >= KHitMenuItem)
                  {
                  // handled on release
                  }
              }

          void CCapContainer::OnRelease(TInt aHit, TPointerState& aState)
              {
              if (aHit >= KHitKey && aHit < KHitMenuItem)
                  {
                  const SKey& k = kRows[(aHit - KHitKey) / 32].k[(aHit - KHitKey) % 32];
                  if (aState.iMod >= 0)
                      {
                      KeyRelease(k.scan, k.sym, aState.iMod);
                      // one-shot modifiers
                      if (iShiftLatch) { iShiftLatch = EFalse; lite_post_key(0, SDL_SCANCODE_LSHIFT, SDLK_LSHIFT, 0); }
                      if (iCtrlLatch) { iCtrlLatch = EFalse; lite_post_key(0, SDL_SCANCODE_LCTRL, SDLK_LCTRL, 0); }
                      }
                  }
              else if (aHit == KHitKbdBtn) { ToggleKeyboard(); }
              else if (aHit == KHitMenuBtn) { iMenu = ETrue; }
              else if (aHit >= KHitMenuItem)
                  {
                  TInt i = aHit - KHitMenuItem;
                  static const TInt fk[6] = { 0, SDL_SCANCODE_F5, SDL_SCANCODE_F9, SDL_SCANCODE_F8, SDL_SCANCODE_F7, SDL_SCANCODE_F10 };
                  static const TInt fs[6] = { 0, SDLK_F5, SDLK_F9, SDLK_F8, SDLK_F7, SDLK_F10 };
                  iMenu = EFalse;
                  if (i > 0) { KeyPress(fk[i], fs[i], 0); KeyRelease(fk[i], fs[i], 0); }
                  }
              }

          void CCapContainer::ApplyPointers()
              {
              TUint mask = 0;
              for (TInt p = 0; p < KMaxPtr; ++p)
                  {
                  TInt id = iPtr[p].iDown ? HitTest(iPtr[p].iPos) : KHitNone;
                  if (id != iPtr[p].iHit)
                      {
                      TInt old = iPtr[p].iHit;
                      iPtr[p].iHit = KHitNone;
                      if (old != KHitNone) { OnRelease(old, iPtr[p]); }
                      iPtr[p].iHit = id;
                      if (id != KHitNone) { OnPress(id, iPtr[p]); }
                      iDirty = ETrue;
                      }
                  if ((id & 0xF00) == KHitPad && id != KHitNone) { mask |= (TUint)(id & 0xF); }
                  else if (id == KHitFire) { mask |= 16; }
                  else if (id == KHitFire + 1) { mask |= 32; }
                  }
              iPadMask = mask;
              if (mask != iLastPadMask) { iLastPadMask = mask; cap32_ios_set_pad(mask | iHwFire); iDirty = ETrue; }
              if (iDirty && !iStarted) { iDirty = EFalse; Refresh(); }
              }

          void CCapContainer::HandlePointerEventL(const TPointerEvent& aEvent)
              {
              TInt n = 0;
          #if USE_MULTITOUCH
              if (aEvent.IsAdvancedPointerEvent()) { n = const_cast<TPointerEvent&>(aEvent).AdvancedPointerEvent()->PointerNumber(); }
          #endif
              if (n < 0 || n >= KMaxPtr) { return; }
              switch (aEvent.iType)
                  {
                  case TPointerEvent::EButton1Down:
                  case TPointerEvent::EDrag:
                      iPtr[n].iDown = ETrue; iPtr[n].iPos = aEvent.iPosition; break;
                  case TPointerEvent::EButton1Up:
                      iPtr[n].iDown = EFalse; iPtr[n].iPos = aEvent.iPosition; break;
                  default:
                      return;
                  }
              ApplyPointers();
              }

          // ------------------------------------------------------------------ OpenGL ES 2 renderer (the only renderer)
          // The picture is a texture drawn by the GPU; the buttons are rendered once into a bitmap (magenta = transparent)
          // and drawn on top as a second texture.  If OpenGL ES 2 cannot start, a message is shown instead of the picture.
          void CCapContainer::Refresh()
              {
              if (iGlState == 1)
                  {
                  iOverlayDirty = ETrue;
                  if (RenderGl()) { return; }
                  }
              DrawNow();
              }

          TBool CCapContainer::TryInitGl()
              {
              iGlState = 2;
              TSize s = Size();
              if (s.iWidth <= 0 || s.iHeight <= 0) { ShowMessage(_L("OpenGL ES 2: no window")); return EFalse; }
              if (!cgl_init((void*)&Window(), s.iWidth, s.iHeight))
                  {
                  ShowMessage(_L("OpenGL ES 2 failed to start (EGL, GLES2 or shaders)"));
                  return EFalse;
                  }
              CFbsBitmap* b = new CFbsBitmap;
              CFbsBitmapDevice* dev = NULL;
              CFbsBitGc* gc = NULL;
              TInt err = b ? b->Create(s, EColor16MU) : KErrNoMemory;
              if (err == KErrNone) { TRAP(err, dev = CFbsBitmapDevice::NewL(b)); }
              if (err == KErrNone) { err = dev->CreateContext(gc); }
              if (err != KErrNone)
                  {
                  delete gc; delete dev; delete b;
                  cgl_shutdown();
                  ShowMessage(_L("OpenGL ES 2: no memory for the button layer"));
                  return EFalse;
                  }
              iOvlBmp = b; iOvlDev = dev; iOvlGc = gc; iOvlSize = s;
              iOverlayDirty = ETrue;
              iGlState = 1;
              return ETrue;
              }

          void CCapContainer::ShutdownGl()
              {
              delete iOvlGc;  iOvlGc = NULL;
              delete iOvlDev; iOvlDev = NULL;
              delete iOvlBmp; iOvlBmp = NULL;
              if (iGlState == 1) { cgl_shutdown(); }
              iGlState = 2;
              }

          void CCapContainer::UpdateOverlayTexture()
              {
              if (!iOvlGc || !iOvlBmp) { return; }
              iOvlGc->SetBrushStyle(CGraphicsContext::ESolidBrush);
              iOvlGc->SetBrushColor(TRgb(255, 0, 255));           // key colour = transparent
              iOvlGc->SetPenStyle(CGraphicsContext::ENullPen);
              iOvlGc->Clear();
              DrawOverlay(*iOvlGc);
              iOvlBmp->LockHeap();
              cgl_upload_overlay((const unsigned int*)iOvlBmp->DataAddress(), iOvlSize.iWidth, iOvlSize.iHeight);
              iOvlBmp->UnlockHeap();
              }

          TBool CCapContainer::RenderGl()
              {
              TSize s = Size();
              if (s != iOvlSize)
                  {
                  ShutdownGl();
                  ShowMessage(_L("OpenGL ES 2: screen size changed, restart the app"));
                  return EFalse;
                  }
              if (iOverlayDirty) { iOverlayDirty = EFalse; UpdateOverlayTexture(); }
              TRect g = GameRect();
              TInt sx0 = 0, sy0 = 0, sx1 = 0, sy1 = 0;
              if (iSrc.Width() > 0 && iSrc.Height() > 0) { sx0 = iSrc.iTl.iX; sy0 = iSrc.iTl.iY; sx1 = iSrc.iBr.iX; sy1 = iSrc.iBr.iY; }
              if (cgl_draw(g.iTl.iX, g.iTl.iY, g.iBr.iX, g.iBr.iY, sx0, sy0, sx1, sy1, s.iWidth, s.iHeight)) { return ETrue; }
              ShutdownGl();
              ShowMessage(_L("OpenGL ES 2: presenting failed"));
              return EFalse;
              }

          TBool CCapContainer::PresentGl(const TUint32* aPix, TInt aH, TInt aPitch, const TRect& aSrc)
              {
              iSrc = aSrc;
              if (iDirty) { iDirty = EFalse; iOverlayDirty = ETrue; }
              cgl_upload_frame((const unsigned int*)aPix, aPitch / 4, aH);
              return RenderGl();
              }

