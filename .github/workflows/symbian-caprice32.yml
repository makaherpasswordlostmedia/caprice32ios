              }

          int plat_stat(const char* p, int* isdir, long* size, long* mtime)
              {
              TFileName n; Conv(p, n);
              if (n.Length() == 3 && n[1] == ':') { *isdir = 1; *size = 0; *mtime = 0; return 0; }   // drive root
              while (n.Length() > 3 && n[n.Length() - 1] == '\\') { n.SetLength(n.Length() - 1); }
              TEntry e;
              if (Fs().Entry(n, e) != KErrNone) { return -1; }
              *isdir = e.IsDir() ? 1 : 0;
              *size = e.iSize;
              TTime epoch(TDateTime(1970, EJanuary, 0, 0, 0, 0, 0));
              TTimeIntervalSeconds s;
              if (e.iModified.SecondsFrom(epoch, s) == KErrNone) { *mtime = s.Int(); } else { *mtime = 0; }
              return 0;
              }

          int plat_mkdir(const char* p)
              {
              TFileName n; Conv(p, n);
              if (n.Length() == 0 || n[n.Length() - 1] != '\\') { n.Append((TChar)'\\'); }
              TInt e = Fs().MkDirAll(n);
              return (e == KErrNone || e == KErrAlreadyExists) ? 0 : -1;
              }

          struct TPlatDir { CDir* iList; TInt iIdx; };

          void* plat_opendir(const char* p)
              {
              TFileName n; Conv(p, n);
              if (n.Length() == 0 || n[n.Length() - 1] != '\\') { n.Append((TChar)'\\'); }
              n.Append((TChar)'*');
