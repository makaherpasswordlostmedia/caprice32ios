          #!/bin/bash
          # Stage the Caprice32 sources into symbian/stage, apply the port overrides, write the core-lib .mmp
          # and fetch the two SDL2 key tables.  Run from the repository root:  bash symbian/tools/stage.sh
          set -euo pipefail
          ROOT=$(pwd); P=$ROOT/symbian; S=$P/stage
          [ -f "$ROOT/src/cap32.cpp" ] || { echo "run from the caprice32 repository root"; exit 1; }
          rm -rf "$S"; mkdir -p "$S"
          cp "$ROOT"/src/*.cpp "$ROOT"/src/*.h "$S"/
          rm -f "$S"/zip.cpp "$S"/savepng.cpp "$S"/ipf.cpp "$S"/net4cpc.cpp "$S"/glfuncs.cpp
          cp "$P"/overrides/* "$S"/
          cp "$ROOT"/CPCVirtualKeyboardBridge.h "$S"/
          # real SDL2 scancode/keycode tables (zlib licence)
          if [ ! -f "$P/sdl/SDL_scancode.h" ] || [ -n "${FORCE_SDL:-}" ]; then
            T=$(mktemp -d); git clone --quiet --depth 1 --branch release-2.30.0 https://github.com/libsdl-org/SDL "$T/sdl"
            cp "$T/sdl/include/SDL_scancode.h" "$T/sdl/include/SDL_keycode.h" "$P/sdl/"
          fi
          # payload for the .pkg
          mkdir -p "$P/app/sis/payload"
          cp "$P/data/cap32.cfg" "$P/app/sis/payload/"
          for r in cpc6128 cpc664 cpc464 amsdos; do cp "$ROOT/rom/$r.rom" "$P/app/sis/payload/"; done
          # core library .mmp
          M=$P/group_core/cap32core.mmp
          {
            echo "// Caprice32 core (C++17, no exceptions/RTTI, freestanding compat runtime) as a static library."
            echo "#include <platform_paths.hrh>"
            echo "TARGET          cap32core.lib"
            echo "TARGETTYPE      lib"
            echo "USERINCLUDE     ../compat"
            echo "USERINCLUDE     ../sdl"
            echo "USERINCLUDE     ../inc"
            echo "USERINCLUDE     ../stage"
            # abld compiles with -I-, so <...> includes are searched in SYSTEMINCLUDE only. The freestanding
            # compat runtime (<string>, <vector>, <sys/stat.h>, ...) must be there, ahead of anything the SDK adds.
            echo "SYSTEMINCLUDE   ../compat"
            echo "SYSTEMINCLUDE   ../sdl"
            echo "SYSTEMINCLUDE   ../inc"
            echo "SYSTEMINCLUDE   ../stage"
            echo "SOURCEPATH      ../stage"
            for f in "$S"/*.cpp; do echo "SOURCE          $(basename "$f")"; done
            echo "SOURCEPATH      ../compat"
            echo "SOURCE          compat.cpp"
            echo "SOURCEPATH      ../sdl"
            echo "SOURCE          sdl_lite.cpp"
            echo "SOURCEPATH      ../src"
            echo "SOURCE          port_stubs.cpp"
            echo "OPTION          GCCE -O2 -fno-exceptions -fno-rtti -w -ffunction-sections -fdata-sections"
            echo "MACRO           CAPRICE_NO_WGUI CAPRICE_NO_LOG CAPRICE_FORCE_KEY_JOYSTICK CAPRICE_FAST_VIDEO CAPRICE_IOS7 CAPRICE_SYMBIAN NDEBUG"
          } > "$M"
          echo "staged $(ls "$S" | wc -l) files; core mmp: $(grep -c '^SOURCE ' "$M") sources"
          CAP32_EOF
      - name: Stage emulator sources and generate the core .mmp
        run: bash symbian/tools/stage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: port-src
          path: symbian
          include-hidden-files: true

  host-test:
    name: Core smoke test (host)
    needs: sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: port-src
          path: symbian
      - name: Build core freestanding, boot CPC6128 headless, type PRINT 6*7
        run: bash symbian/tools/host_test.sh

  build-sis:
    name: Build cap32.sisx
    needs: sources
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 360
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: port-src
          path: symbian

      - name: Check out symbian3-toolchain
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TOOLCHAIN_REPO }}
          ref: ${{ env.TOOLCHAIN_REF }}
          path: toolchain

      - name: Create case-sensitive APFS volume
        run: |
          hdiutil create -size 24g -fs "Case-sensitive APFS" -volname Symbian -type SPARSE "$RUNNER_TEMP/symbian"
          hdiutil attach "$RUNNER_TEMP/symbian.sparseimage" -mountpoint "$SYMBIAN_VOL"
          sudo chown "$(id -u):$(id -g)" "$SYMBIAN_VOL"

      - name: Install Homebrew dependencies and Rosetta
        run: |
          brew install perl openssl@3 unshield make gmp mpfr libmpc isl gnu-sed
          # install-sdk.sh requires perl to resolve to /opt/homebrew/opt/perl/bin/perl, not the linked
          # /opt/homebrew/bin/perl symlink, so keep the keg unlinked (as on a stock Mac).
          brew unlink perl
          sudo softwareupdate --install-rosetta --agree-to-license || true

      - name: Restore toolchain cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /Volumes/Symbian/toolchain
            /Volumes/Symbian/sdks
            /Volumes/Symbian/gnupoc
          key: symbian3-toolchain-${{ env.TOOLCHAIN_REF }}-${{ env.GNUPOC_COMMIT }}-${{ env.GCC4SYMBIAN_COMMIT }}

      - name: Build toolchain and install SDK (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          JOBS: 4
        run: |
          set -eo pipefail
          cd toolchain
          source Scripts/env.sh
          mkdir -p "$N8_SRC"
          git clone https://github.com/mstorsjo/gnupoc-package "$N8_SRC/gnupoc-package"
          git -C "$N8_SRC/gnupoc-package" checkout "$GNUPOC_COMMIT"
          git clone https://github.com/fedor4ever/GCC4Symbian "$N8_SRC/GCC4Symbian"
          git -C "$N8_SRC/GCC4Symbian" checkout "$GCC4SYMBIAN_COMMIT"
          Scripts/fetch-sdk.sh
          Scripts/build-host-tools.sh
          Scripts/build-gcc.sh
          Scripts/install-sdk.sh

      - name: Save toolchain cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /Volumes/Symbian/toolchain
            /Volumes/Symbian/sdks
            /Volumes/Symbian/gnupoc
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build cap32core.lib (C++17)
        run: |
          set -eo pipefail
          source toolchain/Scripts/env.sh
          # The toolchain pins every GCCE C++ build to -std=gnu++98 (CPP_LANG_OPTION in gcce.mk).
          # The emulator core needs C++17, so the pin is lifted while the static library is built
          # and restored afterwards for the Avkon front end.
          GCCEMK=$(find "$SYMBIAN_VOL/sdks" -path '*epoc32/tools/compilation_config/gcce.mk' -print -quit)
          test -n "$GCCEMK" || { echo "gcce.mk not found"; exit 1; }
          echo "GCCEMK=$GCCEMK" >> "$GITHUB_ENV"
          grep -n 'CPP_LANG_OPTION' "$GCCEMK"
          /usr/bin/perl -pi -e 's/-std=gnu\+\+98/-std=gnu++17/' "$GCCEMK"
          grep -q 'gnu++17' "$GCCEMK" || { echo "could not switch gcce.mk to gnu++17"; exit 1; }
          # gcce.h force-includes <symcpp.h> (-include gcce.h) into every translation unit.  Make it resolvable:
          # use the SDK's copy (its directory goes AFTER ../compat, so compat's own <string> etc. still win);
          # if the SDK has none, fall back to an empty stub in compat.
          GCCEH=$(find "$SYMBIAN_VOL/sdks" -path '*epoc32/include/gcce/gcce.h' -print -quit)
          [ -n "$GCCEH" ] && { echo "--- $GCCEH (symcpp context)"; grep -n -B6 -A2 'symcpp' "$GCCEH" || true; }
          SYMCPP=$(find "$SYMBIAN_VOL/sdks" "$SYMBIAN_VOL/toolchain" -name symcpp.h -print -quit 2>/dev/null || true)
          CORE_MMP=symbian/group_core/cap32core.mmp
          if [ -n "$SYMCPP" ]; then
            SYMDIR=$(dirname "$SYMCPP")
            case "$SYMDIR" in
              */epoc32/*) SYMINC="/epoc32/${SYMDIR#*/epoc32/}" ;;
              *)          SYMINC="$SYMDIR" ;;
            esac
            echo "symcpp.h found: $SYMCPP -> SYSTEMINCLUDE $SYMINC"
            echo "SYSTEMINCLUDE   $SYMINC" >> "$CORE_MMP"
          else
            echo "symcpp.h not found anywhere in the SDK/toolchain; using an empty stub in compat"
            printf '/* stub: gcce.h force-includes this; the core is freestanding */\nnamespace std { struct nothrow_t {}; }\n' > symbian/compat/symcpp.h
          fi
          cd symbian/group_core
          bldmake bldfiles
          abld build -keepgoing gcce urel 2>&1 | tee "$GITHUB_WORKSPACE/core-build.log"
          LIB=$(find "$SYMBIAN_VOL/sdks" -name 'cap32core.lib' -print -quit)
          test -n "$LIB" || { echo "cap32core.lib was not produced"; grep -n 'rror\|No rule' "$GITHUB_WORKSPACE/core-build.log" | head -50; exit 1; }
          ls -l "$LIB"

      - name: Build cap32.exe (C++98)
        run: |
          set -eo pipefail
          source toolchain/Scripts/env.sh
          /usr/bin/perl -pi -e 's/-std=gnu\+\+17/-std=gnu++98/' "$GCCEMK"
          grep -q 'gnu++98' "$GCCEMK" || { echo "could not restore gcce.mk"; exit 1; }
          mkdir -p symbian/appinc
          # Self-contained <string.h> for the C++98 front end: the Symbian build has no compiler include dir
          # (no <stddef.h>), so size_t comes from the compiler builtin.  The functions are defined in cap32core.lib.
          cat > symbian/appinc/string.h <<'APPINC_EOF'
          #ifndef APPINC_STRING_H
          #define APPINC_STRING_H
          #ifndef _SIZE_T_DECLARED
          typedef __SIZE_TYPE__ size_t;
          #define _SIZE_T_DECLARED
          #endif
          extern "C" {
          void* memcpy(void*, const void*, size_t); void* memmove(void*, const void*, size_t);
          void* memset(void*, int, size_t); int memcmp(const void*, const void*, size_t); void* memchr(const void*, int, size_t);
          size_t strlen(const char*); char* strcpy(char*, const char*); char* strncpy(char*, const char*, size_t);
          char* strcat(char*, const char*); int strcmp(const char*, const char*); int strncmp(const char*, const char*, size_t);
          int strcasecmp(const char*, const char*); int strncasecmp(const char*, const char*, size_t);
          char* strchr(const char*, int); char* strrchr(const char*, int); char* strstr(const char*, const char*);
          char* strdup(const char*); char* strtok(char*, const char*); char* strerror(int);
          }
          #endif
          APPINC_EOF
          # OpenGL ES 2 is the only renderer: the SDK must ship the EGL and GLES2 import libraries (.dso for GCCE)
          GLDIR=$(find "$SYMBIAN_VOL/sdks" -type d -ipath '*epoc32/release/armv5/lib' -print -quit 2>/dev/null || true)
          echo "--- EGL/GLES libraries in ${GLDIR:-<no lib dir>}:"
          ls "$GLDIR" 2>/dev/null | grep -i 'egl\|gles' || true
          EGLB=$(ls "$GLDIR" 2>/dev/null | grep -i '^libegl\.dso$' | head -1 | sed 's/\.[^.]*$//' || true)
          GLESB=$(ls "$GLDIR" 2>/dev/null | grep -i '^libglesv2\.dso$' | head -1 | sed 's/\.[^.]*$//' || true)
          if [ -z "$EGLB" ] || [ -z "$GLESB" ]; then
            echo "::error::EGL/GLES2 import libraries (libegl.dso, libglesv2.dso) not found in the SDK: cannot build the OpenGL ES 2 renderer"
            exit 1
          fi
          echo "OpenGL ES 2 libraries: $EGLB $GLESB"
          echo "LIBRARY         $EGLB.lib $GLESB.lib bitgdi.lib" >> symbian/group_app/cap32.mmp
          cd symbian/group_app
          bldmake bldfiles
          abld build -keepgoing gcce urel 2>&1 | tee "$GITHUB_WORKSPACE/app-build.log"
          EXE=$(find "$SYMBIAN_VOL/sdks" -name 'cap32.exe' -path '*urel*' -print -quit)
          test -n "$EXE" || { echo "cap32.exe was not produced"; grep -n 'rror\|undefined\|multiple definition' "$GITHUB_WORKSPACE/app-build.log" | head -60; exit 1; }
          ls -l "$EXE"
          # symbol list for turning addresses from the device log (PC / LR in the WD lines of cap32_log.txt) into function names
          SYM=$(find "$SYMBIAN_VOL/sdks" \( -name 'cap32.exe.sym' -o -name 'cap32.sym' \) -print -quit 2>/dev/null || true)
          MAPF=$(find "$SYMBIAN_VOL/sdks" -name 'cap32*.map' -print -quit 2>/dev/null || true)
          NM=$(command -v arm-none-symbianelf-nm || find "$SYMBIAN_VOL" -name 'arm-none-symbianelf-nm' -print -quit 2>/dev/null || true)
          OD=$(command -v arm-none-symbianelf-objdump || find "$SYMBIAN_VOL" -name 'arm-none-symbianelf-objdump' -print -quit 2>/dev/null || true)
          mkdir -p "$GITHUB_WORKSPACE/symbols"
          echo "symbol file: ${SYM:-<none>}  map: ${MAPF:-<none>}  nm: ${NM:-<none>}"
          if [ -n "$SYM" ] && [ -n "$NM" ]; then
            "$NM" -n -C "$SYM" > "$GITHUB_WORKSPACE/symbols/cap32-symbols.txt" || true
            [ -n "$OD" ] && "$OD" -h "$SYM" > "$GITHUB_WORKSPACE/symbols/cap32-sections.txt" || true
          fi
          [ -n "$MAPF" ] && cp "$MAPF" "$GITHUB_WORKSPACE/symbols/" || true
          ls -l "$GITHUB_WORKSPACE/symbols" || true

      - name: Package signed SIS
        run: |
          set -eo pipefail
          source toolchain/Scripts/env.sh
          mkdir -p "$GITHUB_WORKSPACE/dist"
          "$N8_REPO/Scripts/package-sis.sh" symbian/app/sis/cap32.pkg "$GITHUB_WORKSPACE/dist"
          ls -l "$GITHUB_WORKSPACE/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: cap32-symbian3
          path: dist/cap32.sisx

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cap32-symbols
          path: symbols/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            core-build.log
            app-build.log
          if-no-files-found: ignore

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/cap32.sisx
