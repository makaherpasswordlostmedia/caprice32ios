          int plat_open(const char* path, int mode)
              {
              TFileName n; Conv(path, n);
              TInt h = -1;
              for (TInt i = 0; i < MAXH; ++i) { if (!gUsed[i]) { h = i; break; } }
              if (h < 0) { return -1; }
              TInt err;
              if (mode == 0)
                  {
                  err = gFile[h].Open(Fs(), n, EFileRead | EFileShareAny);
                  if (err != KErrNone) { err = gFile[h].Open(Fs(), n, EFileRead | EFileShareReadersOnly); }
                  }
              else if (mode == 1)
                  {
                  err = gFile[h].Replace(Fs(), n, EFileWrite | EFileShareAny);
