          EGLSurface eglCreateWindowSurface(EGLDisplay aDpy, EGLConfig aCfg, void* aWin, const EGLint* aAttribs);
          EGLContext eglCreateContext(EGLDisplay aDpy, EGLConfig aCfg, EGLContext aShare, const EGLint* aAttribs);
