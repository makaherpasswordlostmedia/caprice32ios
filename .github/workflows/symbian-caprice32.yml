          extern "C" {
          void* plat_alloc(size_t n) { return __libc_malloc(n); }
          void plat_free(void* p) { __libc_free(p); }
          void* plat_realloc(void* p, size_t n) { return __libc_realloc(p, n); }
          int plat_open(const char* p, int m) { return open(p, m == 0 ? O_RDONLY : m == 1 ? (O_WRONLY|O_CREAT|O_TRUNC) : (O_WRONLY|O_CREAT|O_APPEND), 0644); }
          long plat_read(int h, void* b, long n) { return read(h, b, n); }
          long plat_write(int h, const void* b, long n) { return write(h, b, n); }
          long plat_seek(int h, long o, int w) { return lseek(h, o, w); }
          long plat_size(int h) { long c = lseek(h, 0, SEEK_CUR); long e = lseek(h, 0, SEEK_END); lseek(h, c, SEEK_SET); return e; }
          void plat_close(int h) { close(h); }
          int plat_remove(const char* p) { return unlink(p); }
          int plat_rename(const char* a, const char* b) { NX(int, rename, (const char*,const char*)); return rename_p(a, b); }
          int plat_stat(const char* p, int* d, long* sz, long* mt) { struct stat s; NX(int, stat, (const char*,struct stat*)); if (stat_p(p, &s)) return -1; *d = S_ISDIR(s.st_mode); *sz = s.st_size; *mt = s.st_mtime; return 0; }
          int plat_mkdir(const char* p) { NX(int, mkdir, (const char*,mode_t)); return mkdir_p(p, 0755); }
          void* plat_opendir(const char* p) { NX(DIR*, opendir, (const char*)); return opendir_p(p); }
          int plat_readdir(void* d, char* n, int len, int* isd) { NX(struct dirent*, readdir, (DIR*)); struct dirent* e = readdir_p((DIR*)d); if (!e) return 0; strncpy(n, e->d_name, len); *isd = e->d_type == DT_DIR; return 1; }
          void plat_closedir(void* d) { NX(int, closedir, (DIR*)); closedir_p((DIR*)d); }
          void plat_sleep_ms(int ms) { struct timespec t = { ms / 1000, (ms % 1000) * 1000000L }; nanosleep(&t, 0); }
          unsigned plat_ticks(void) { struct timespec t; clock_gettime(CLOCK_MONOTONIC, &t); return t.tv_sec * 1000u + t.tv_nsec / 1000000; }
          long plat_time(void) { struct timespec t; clock_gettime(CLOCK_REALTIME, &t); return t.tv_sec; }
          void plat_exit(int c) { const char m[] = "plat_exit\n"; if (write(2, m, sizeof m - 1)) {} _exit(c); }
