          // cap32_gl.h - OpenGL ES 2 output for the Symbian^3 front end (the only renderer).
          #ifndef CAP32_GL_H
          #define CAP32_GL_H
          int  cgl_init(void* aNativeWindow, int aW, int aH);                 // EGL window surface + GLES2 context + shaders
          void cgl_shutdown(void);
          void cgl_upload_frame(const unsigned int* aPx, int aTexW, int aH);  // XRGB8888, aTexW = pixels per row
          void cgl_upload_overlay(const unsigned int* aPx, int aW, int aH);   // XRGB8888, magenta = transparent
          int  cgl_draw(int gx0, int gy0, int gx1, int gy1,                   // game rectangle in window pixels
                        int sx0, int sy0, int sx1, int sy1,                   // visible part of the frame (0 = whole frame)
                        int winW, int winH);                                  // returns 0 when presenting failed
