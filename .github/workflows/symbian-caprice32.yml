          cat > symbian/compat/vector <<'CAP32_EOF'
          #ifndef CP_VECTOR
          #define CP_VECTOR
          #include <stdlib.h>
          #include <string.h>
          #include <new>
          #include <utility>
          #include <initializer_list>
          namespace std {
          template<class T> class vector {
            T* _d; size_t _n, _c;
            void _reserve(size_t c) {
              if (c <= _c) return;
              size_t nc = _c ? _c * 2 : 4; if (nc < c) nc = c;
              T* nd = (T*)malloc(nc * sizeof(T));
              for (size_t i = 0; i < _n; ++i) { new (nd + i) T(move(_d[i])); _d[i].~T(); }
              free(_d); _d = nd; _c = nc;
            }
          public:
            typedef T value_type; typedef T* iterator; typedef const T* const_iterator; typedef size_t size_type;
            vector() : _d(0), _n(0), _c(0) {}
            explicit vector(size_t n) : _d(0), _n(0), _c(0) { resize(n); }
            vector(size_t n, const T& v) : _d(0), _n(0), _c(0) { for (size_t i = 0; i < n; ++i) push_back(v); }
            template<class I> vector(I f, I l, typename enable_if<!is_integral<I>::value, int>::type = 0) : _d(0), _n(0), _c(0) { for (; f != l; ++f) push_back(*f); }
            template<class I> typename enable_if<!is_integral<I>::value, void>::type assign(I f, I l) { clear(); for (; f != l; ++f) push_back(*f); }
            vector(initializer_list<T> il) : _d(0), _n(0), _c(0) { for (const T* i = il.begin(); i != il.end(); ++i) push_back(*i); }
            vector(const vector& o) : _d(0), _n(0), _c(0) { _reserve(o._n); for (size_t i = 0; i < o._n; ++i) push_back(o._d[i]); }
            vector(vector&& o) : _d(o._d), _n(o._n), _c(o._c) { o._d = 0; o._n = o._c = 0; }
            ~vector() { clear(); free(_d); }
            vector& operator=(const vector& o) { if (this != &o) { clear(); _reserve(o._n); for (size_t i = 0; i < o._n; ++i) push_back(o._d[i]); } return *this; }
            vector& operator=(vector&& o) { if (this != &o) { clear(); free(_d); _d = o._d; _n = o._n; _c = o._c; o._d = 0; o._n = o._c = 0; } return *this; }
            size_t size() const { return _n; } bool empty() const { return !_n; } size_t capacity() const { return _c; }
            void reserve(size_t n) { _reserve(n); }
            T& operator[](size_t i) { return _d[i]; } const T& operator[](size_t i) const { return _d[i]; }
            T& at(size_t i) { return _d[i]; } const T& at(size_t i) const { return _d[i]; }
            T& front() { return _d[0]; } T& back() { return _d[_n - 1]; } const T& front() const { return _d[0]; } const T& back() const { return _d[_n - 1]; }
            T* data() { return _d; } const T* data() const { return _d; }
            iterator begin() { return _d; } iterator end() { return _d + _n; } const_iterator begin() const { return _d; } const_iterator end() const { return _d + _n; }
            void push_back(const T& v) { if (_n == _c) { T t(v); _reserve(_n + 1); new (_d + _n) T(move(t)); } else new (_d + _n) T(v); ++_n; }
            void push_back(T&& v) { if (_n == _c) { T t(move(v)); _reserve(_n + 1); new (_d + _n) T(move(t)); } else new (_d + _n) T(move(v)); ++_n; }
            template<class... A> T& emplace_back(A&&... a) { T t(forward<A>(a)...); push_back(move(t)); return back(); }
            void pop_back() { --_n; _d[_n].~T(); }
            void clear() { for (size_t i = 0; i < _n; ++i) _d[i].~T(); _n = 0; }
            void resize(size_t n) { if (n < _n) { for (size_t i = n; i < _n; ++i) _d[i].~T(); _n = n; } else { _reserve(n); for (; _n < n; ++_n) new (_d + _n) T(); } }
            void resize(size_t n, const T& v) { if (n < _n) resize(n); else { _reserve(n); for (; _n < n; ++_n) new (_d + _n) T(v); } }
            void assign(size_t n, const T& v) { clear(); for (size_t i = 0; i < n; ++i) push_back(v); }
            iterator erase(const_iterator f, const_iterator l) { size_t a = f - _d, b = l - _d, k = b - a; if (!k) return _d + a; for (size_t i = a; i + k < _n; ++i) _d[i] = move(_d[i + k]); for (size_t i = _n - k; i < _n; ++i) _d[i].~T(); _n -= k; return _d + a; }
            iterator erase(const_iterator p) { return erase(p, p + 1); }
            iterator insert(const_iterator p, const T& v) { size_t a = p - _d; T t(v); _reserve(_n + 1); if (a < _n) { new (_d + _n) T(move(_d[_n - 1])); for (size_t i = _n - 1; i > a; --i) _d[i] = move(_d[i - 1]); _d[a] = move(t); } else new (_d + _n) T(move(t)); ++_n; return _d + a; }
            template<class I> iterator insert(const_iterator p, I f, I l) { size_t a = p - _d; for (; f != l; ++f, ++a) insert(_d + a, *f); return _d + a; }
            void swap(vector& o) { std::swap(_d, o._d); std::swap(_n, o._n); std::swap(_c, o._c); }
          };
          }
          #endif
          CAP32_EOF
