            long z = days + 719468; long era = z / 146097; long doe = z - era * 146097; long yoe = (doe - doe / 1460 + doe / 36524 - doe / 146096) / 365;
            long y = yoe + era * 400; long doy = doe - (365 * yoe + yoe / 4 - yoe / 100); long mp = (5 * doy + 2) / 153;
            r.tm_mday = (int)(doy - (153 * mp + 2) / 5 + 1); int m = (int)(mp < 10 ? mp + 3 : mp - 9); if (m <= 2) ++y;
            r.tm_mon = m - 1; r.tm_year = (int)(y - 1900); r.tm_yday = 0; r.tm_isdst = 0; return &r;
