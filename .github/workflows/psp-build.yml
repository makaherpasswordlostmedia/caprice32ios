      - name: Install PSP libraries
        run: |
          psp-pacman -Sy --needed --noconfirm sdl2 libpng zlib

      - name: Build
        run: |
          make -f Makefile.psp -j"$(nproc)" package

      - name: Upload Caprice32 folder
        uses: actions/upload-artifact@v4
        with:
          name: Caprice32-PSP
          # copy this folder to ms0:/PSP/GAME/ on the Memory Stick
          path: dist/

      - name: Attach to release
        if: github.event_name == 'release'
        run: |
          apt-get update -qq && apt-get install -y -qq zip >/dev/null
          (cd dist && zip -r ../Caprice32-PSP.zip Caprice32)
          gh release upload "${{ github.event.release.tag_name }}" Caprice32-PSP.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
