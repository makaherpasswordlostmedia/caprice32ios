name: symbian-build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: { arch: [armv6, armv5t] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Host smoke test (shim + core, null backend)
        run: |
          sudo apt-get update && sudo apt-get install -y zlib1g-dev g++
          python3 symbian/patches/apply.py .
          python3 symbian/tools/gen_keys.py . symbian/shim/SDL_keys_gen.h
          bash symbian/tools/host_smoke.sh
      - name: Install Symbian SDK
        run: |
          pip install symbian-platform
          curl -fL "https://github.com/hpnkv/symbian-platform/releases/download/v0.1.1/symbian-sdk-0.1.1-linux-x86_64.tar.gz" -o sdk.tgz
          mkdir -p $HOME/sdk && tar -xzf sdk.tgz -C $HOME/sdk
      - name: Fetch zlib source
        run: |
          curl -fL https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz | tar xz
          mkdir -p symbian/third_party/zlib
          cp zlib-1.3.1/{adler32,crc32,deflate,infback,inffast,inflate,inftrees,trees,zutil,compress,uncompr}.c zlib-1.3.1/*.h symbian/third_party/zlib/
      - name: Reuse SDK GUI startup glue
        run: |
          mkdir -p symbian/glue
          cp $HOME/sdk/examples/gui_app/{startup.S,startup.cc,image.ld} symbian/glue/ || true
          cp $HOME/sdk/examples/gui_app/CMakeLists.txt symbian/glue/reference_CMakeLists.txt || true
          echo '--- image.ld (original)'; cat symbian/glue/image.ld || true
      - name: Inspect SDK (shows how the SDK's own example wires CMake)
        run: |
          SDK=$HOME/sdk
          ls $SDK $SDK/cmake || true
          find $SDK -name '*.cmake' -not -path '*/host/*' | head -40 || true
          echo '--- examples/hello_time/CMakeLists.txt'; cat $SDK/examples/hello_time/CMakeLists.txt || true
          echo '--- gui_app'; ls $SDK/examples $SDK/examples/gui_app || true
          echo '--- proxies'; ls -R $SDK/proxies | head -120 || true
          echo '--- .def / export definition files anywhere in SDK'; find $SDK \( -iname '*.def' -o -iname '*.dso.txt' -o -iname '*proxy*.json' \) | head -50 || true
          for d in libc libm drtaeabi euser ws32; do echo "--- exports of $d.dso"; ls $SDK/bin | grep -E 'nm|objdump|readelf' | head -3; (for t in llvm-nm nm; do [ -x $SDK/bin/$t ] && $SDK/bin/$t -D --defined-only $SDK/proxies/$d/$d.dso && break; done) | head -400 || true; done
          echo '--- symbian-native / CLI help for proxy generation'; $SDK/bin/symbian-native proxy-sources --help || true; symbian toolchain import-proxy --help || true
      - name: Inspect converter and the SDK example's own ELF layout
        continue-on-error: true
        run: |
          SDK=$HOME/sdk
          echo '--- SymbianApp.cmake'; cat $SDK/cmake/SymbianApp.cmake | head -400
          echo '--- e32.cc candidates'; find $SDK -name 'e32*.cc' -o -name 'e32*.h' | head
          for f in $(find $SDK -name 'e32.cc' | head -1); do sed -n 560,720p $f; done
          echo '--- converter strings'; (strings -n 6 $SDK/bin/symbian-native | grep -iE "writable|data/BSS|\.got|\.dynamic|init_array" | head -40) || true
          echo '--- build SDK hello_time and dump its sections'
          $SDK/bin/cmake -S $SDK/examples/hello_time -B /tmp/hello -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$SDK/cmake/symbian-arm.cmake -DSYMBIAN_SDK_PREFIX=$SDK \
            -DCMAKE_MAKE_PROGRAM=$SDK/bin/ninja -DSYMBIAN_TARGET_ARCH=${{ matrix.arch }} || true
          $SDK/bin/cmake --build /tmp/hello || true
          python3 symbian/tools/elf_sections.py /tmp/hello/hello_time.elf || true
          readelf -lW /tmp/hello/hello_time.elf || true
      - name: Bisect converter limits on the SDK example (big BSS / pointer data)
        continue-on-error: true
        run: |
          SDK=$HOME/sdk
          try() {  # name, extra source file content
            d=/tmp/v_$1; rm -rf $d; cp -r $SDK/examples/hello_time $d
            printf '%s\n' "$2" > $d/extra.cc
            sed -i 's/SOURCES app.cc/SOURCES extra.cc app.cc/' $d/CMakeLists.txt
            echo 'target_link_options(hello_time PRIVATE --undefined=probe_sym)' >> $d/CMakeLists.txt
            $SDK/bin/cmake -S $d -B $d/b -G Ninja -DCMAKE_TOOLCHAIN_FILE=$SDK/cmake/symbian-arm.cmake \
              -DSYMBIAN_SDK_PREFIX=$SDK -DCMAKE_MAKE_PROGRAM=$SDK/bin/ninja -DSYMBIAN_TARGET_ARCH=${{ matrix.arch }} >/dev/null
            if $SDK/bin/cmake --build $d/b > $d/log.txt 2>&1; then echo "RESULT $1: OK"; else echo "RESULT $1: FAIL"; tail -6 $d/log.txt | cut -c1-200; fi
            python3 symbian/tools/elf_sections.py $d/b/hello_time.elf | grep -E "^\.(data|bss)"
          }
          try bss480k 'extern "C" { char probe_sym[480000]; }'
          try bss240k 'extern "C" { char probe_sym[240000]; }'
          try data20k_ptrs 'extern "C" { const char* probe_sym[5000] = {"a","b","c","d"}; }'
          try data20k_plain 'extern "C" { int probe_sym[5000] = {1,2,3,4}; }'
      - name: Discover original Symbian export definitions (for the missing import proxies)
        continue-on-error: true
        run: |
          echo "--- tool availability"; which symbian c++filt || true
          symbian toolchain import-proxy --help 2>&1 | head -60 || true
          $HOME/sdk/bin/symbian-native proxy-sources --help 2>&1 | head -60 || true
          mkdir -p $HOME/defs && cd $HOME/defs
          for r in oss.FCL.sf.os.kernelhwsrv oss.FCL.sf.os.graphics oss.FCL.sf.os.ossrv; do
            timeout 600 git clone --depth 1 -q https://github.com/SymbianSource/$r.git || echo "clone failed: $r"
          done
          ls
          cd $GITHUB_WORKSPACE && python3 symbian/tools/find_defs.py $HOME/defs
      - name: Generate missing import proxies from the original .def files
        continue-on-error: true
        run: |
          SDK=$HOME/sdk
          SDK=$SDK python3 symbian/tools/gen_proxies.py $HOME/defs $PWD/symbian/proxies_gen
      - name: Configure and build
        run: |
          SDK=$HOME/sdk
          $SDK/bin/cmake -S symbian -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$SDK/cmake/symbian-arm.cmake -DSYMBIAN_SDK_PREFIX=$SDK \
            -DCMAKE_MAKE_PROGRAM=$SDK/bin/ninja -DSYMBIAN_TARGET_ARCH=${{ matrix.arch }} -DCAP32_ROOT=$PWD -DCAP_PROXY_DIR=$PWD/symbian/proxies_gen
          $SDK/bin/cmake --build build -- -k 0
      - name: Diagnose link layout (only on failure)
        if: failure()
        run: |
          SDK=$HOME/sdk
          python3 symbian/tools/elf_sections.py build/caprice32.elf || true
          readelf -lW build/caprice32.elf || true
          readelf -x .got -x .got.plt build/caprice32.elf || true
          echo '--- image.ld (patched)'; cat symbian/glue/image.ld || true
      - name: Stage payload next to the project
        run: |
          mkdir -p symbian/payload/rom symbian/payload/disks symbian/payload/snap
          cp rom/*.rom rom/system.cpr symbian/payload/rom/ 2>/dev/null || true
          cp symbian/package/cap32.cfg symbian/payload/
      - name: Build SIS (SDK CLI; prints help first so a flag mismatch is visible in the log)
        run: |
          source ~/.venv/bin/activate 2>/dev/null || true
          symbian app --help || true
          symbian app build --help || true
          # reference project generated by the SDK itself, to diff symbian.toml keys against ours
          symbian init /tmp/ref --name ref --non-interactive || true
          mkdir -p out && cp /tmp/ref/symbian.toml out/reference_symbian.toml 2>/dev/null || true
          cp symbian/symbian.toml symbian/symbian.toml.bak
          symbian app build --project symbian --architecture ${{ matrix.arch }} || symbian app package --project symbian
          find . -name '*.sis*' -not -path './node_modules/*' -exec cp {} out/ \; || true
          cp build/e32/caprice32.exe out/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: caprice32-symbian-${{ matrix.arch }}
          path: out/
