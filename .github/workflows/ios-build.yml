name: Build iOS .ipa (armv7, iOS 7.1.2 / iPad 1)

# Cross-compiles Caprice32 (Amstrad CPC emulator, SDL2-based) for 32-bit
# iOS 7.x (deployment target 7.0, built against the 9.3 SDK) with Theos + clang on ubuntu-latest. No Xcode / no Mac runner
# required. Pipeline structure adapted from a Theos-based armv7 CI used
# for other SDL/UIKit ports targeting the same legacy toolchain.
#
# Caprice32 links SDL2, freetype2, libpng and zlib. None of these ship
# with Theos or the bare iOS SDK, so this workflow builds all four from
# source before the actual app build, since SDL2's own iOS build path
# (Xcode-iOS/SDL/SDL.xcodeproj, or CMake's CMAKE_OSX_SYSROOT which
# itself shells out to xcrun) assumes a real Xcode install that this
# Ubuntu runner doesn't have. Instead we compile SDL2's iOS-relevant
# source subset directly against the Theos clang cross toolchain,
# mirroring the file groups in SDL2's own Xcode project (video/uikit,
# joystick/iphoneos, audio/coreaudio, etc. - see the build step for the
# full breakdown and reasoning per subsystem).

on:
  push:
    branches: [touchhle]
    paths:
      - "src/**"
      - "ios/**"
      - "roms/**"
      - "control"
      - "entitlements.plist"
      - "Makefile"
      - "*.mm"
      - "*.m"
      - "*.h"
      - "Resources/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "ios/**"
      - "roms/**"
      - "control"
      - "entitlements.plist"
      - "Makefile"
      - "*.mm"
      - "*.m"
      - "*.h"
      - "Resources/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch: {}

env:
  # SDK used for headers/frameworks (stubs for linking).
  IOS_SDK_VERSION: "9.3"
  # Mach-O LC_VERSION_MIN_IPHONEOS. Must be <= the device OS, otherwise
  # dyld on iOS 7.1.2 refuses to load the binary.
  IOS_DEPLOY_TARGET: "7.0"

jobs:
  build-ios-armv7:
    name: Build (Theos / iOS 7.0+ / armv7)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Identify commit
        id: commit-info
        run: |
          echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(git log -1 --format=%cd --date=short)" >> $GITHUB_OUTPUT

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release software-properties-common \
                                  build-essential perl curl ca-certificates \
                                  zip unzip xz-utils bzip2 git fakeroot make \
                                  autoconf automake libtool pkg-config

      - name: Install Theos + iOS cross toolchain
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          # Theos expects the iOS cross compiler at
          # $THEOS/toolchain/linux/iphone/bin/clang. Grab the Linux->iOS
          # toolchain release (bundles clang, ld64, cctools, libtapi,
          # ldid, etc.) which supports the legacy 32-bit ARM ABI.
          mkdir -p "$THEOS/toolchain/linux/iphone"
          curl -fsSL \
            "https://github.com/L1ghtmann/llvm-project/releases/download/main-update_3-eabca92/iOSToolchain-x86_64.tar.xz" \
            -o /tmp/ios-toolchain.tar.xz
          tar -xf /tmp/ios-toolchain.tar.xz -C "$THEOS/toolchain"
          ls "$THEOS/toolchain/linux/iphone/bin" | head -20
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Fix missing libc++ __config_site
        env:
          THEOS: ${{ github.workspace }}/theos
          LLVM_COMMIT: "eabca92"
        run: |
          # This toolchain release (main-update_3-eabca92, built from
          # commit eabca92 in L1ghtmann/llvm-project) ships libc++'s
          # headers but not the generated __config_site that CMake
          # normally produces when libc++ itself is built. Without it,
          # <__config> (pulled in transitively by nearly every libc++
          # header) fails immediately with "'__config_site' file not
          # found". Fetch the real __config_site.in template from that
          # exact commit and fill it in the way this toolchain's build
          # actually would: pthreads as the thread API (Darwin/iOS),
          # Itanium ABI version 1, no feature sets disabled (this
          # libc++ ships full filesystem/locale/wide-char support).
          CONFIG_DIRS="$(grep -rl '__config_site' \
            "$THEOS/toolchain/linux/iphone/include" 2>/dev/null \
            | xargs -n1 dirname | sort -u)"
          echo "Dirs needing __config_site:"
          echo "$CONFIG_DIRS"
          if [ -z "$CONFIG_DIRS" ]; then
            echo "::error::No __config referencing __config_site found - toolchain layout differs from expected."
            exit 1
          fi

          curl -fsSL \
            "https://raw.githubusercontent.com/L1ghtmann/llvm-project/${LLVM_COMMIT}/libcxx/include/__config_site.in" \
            -o /tmp/__config_site.in
          echo "----- Template (__config_site.in) -----"
          cat /tmp/__config_site.in
          echo "-----------------------------------------"

          # Sanity check: the __config_site we're about to generate must
          # match the ABI namespace actually baked into this toolchain's
          # prebuilt static libc++.a, not just upstream's CMake defaults.
          # If they disagree, every std:: symbol mismatches at link time
          # (exactly the "Undefined symbols ... _LIBCPP_ABI_NAMESPACE ..."
          # wall this step exists to prevent).
          LIBCXX_A="$(find "$THEOS/toolchain/linux/iphone" -name 'libc++.a' | head -1)"
          if [ -z "$LIBCXX_A" ]; then
            echo "::error::Could not find libc++.a in toolchain to verify ABI namespace."
            exit 1
          fi
          # Look for a mangled symbol containing an explicit ABI namespace
          # tag (e.g. 5__1 or similar numbered identifier) vs plain "St".
          if nm "$LIBCXX_A" 2>/dev/null | grep -q '_ZNSt3__1'; then
            DETECTED_NAMESPACE="__1"
          elif nm "$LIBCXX_A" 2>/dev/null | grep -qE '_ZNSt[0-9]+[A-Za-z_]+[0-9]'; then
            DETECTED_NAMESPACE="$(nm "$LIBCXX_A" | grep -oE '_ZNSt[0-9]+[A-Za-z_]+' | head -1 | sed -E 's/_ZNSt[0-9]+//')"
          else
            DETECTED_NAMESPACE=""
          fi
          echo "Detected ABI namespace in prebuilt libc++.a: '${DETECTED_NAMESPACE:-<none/plain std>}'"

          # Turn #cmakedefine / #cmakedefine01 lines into real #define
          # (or commented-out #undef) lines, AND resolve the bare
          # @VAR@-style substitutions this template also contains
          # (those aren't #cmakedefine lines at all, so a rule that
          # only handles #cmakedefine leaves literal "@_FOO@" text in
          # the output - which clang then chokes on as raw
          # non-preprocessor tokens, "expected unqualified-id").
          #
          # Explicit choices made here, matching a standard release
          # build of libc++ for a Darwin/iOS target:
          #   _LIBCPP_ABI_VERSION            -> 1        (current ABI)
          #   _LIBCPP_HAS_THREAD_API_PTHREAD -> defined  (Darwin/iOS use pthreads)
          #   _LIBCPP_HARDENING_MODE_DEFAULT -> _LIBCPP_HARDENING_MODE_NONE
          #       (matches upstream's own default for a non-hardened,
          #       non-debug release build; this __config lists NONE
          #       first among the four valid values and every other
          #       Apple-target libc++ ships with this default absent
          #       an explicit opt-in to hardening)
          #   Exactly one _LIBCPP_PSTL_CPU_BACKEND_* -> SERIAL
          #       (the no-extra-dependency default backend; THREAD
          #       needs libc++'s own thread pool wiring and
          #       LIBDISPATCH needs Apple's libdispatch, neither of
          #       which this bare cross-toolchain build sets up)
          #   @_LIBCPP_ABI_DEFINES@, @_LIBCPP_EXTRA_SITE_DEFINES@ -> blank
          #       (these are lists of extra #define lines that CMake
          #       splices in from its own ABI-breaking-change config;
          #       empty is the correct value for a build enabling no
          #       non-default ABI flags, which matches everything else
          #       chosen above)
          awk -v ns="$DETECTED_NAMESPACE" '
            /^#cmakedefine01[ \t]+_LIBCPP_HAS_THREAD_API_PTHREAD/ {
              print "#define _LIBCPP_HAS_THREAD_API_PTHREAD 1"; next
            }
            /^#cmakedefine01[ \t]+/ {
              name=$2; print "#define " name " 0"; next
            }
            /^#cmakedefine[ \t]+_LIBCPP_ABI_VERSION/ {
              print "#define _LIBCPP_ABI_VERSION 1"; next
            }
            /^#cmakedefine[ \t]+_LIBCPP_ABI_NAMESPACE/ {
              if (ns != "") { print "#define _LIBCPP_ABI_NAMESPACE " ns } else { print "/* #undef _LIBCPP_ABI_NAMESPACE */" }
              next
            }
            /^#cmakedefine[ \t]+_LIBCPP_HAS_THREAD_API_PTHREAD/ {
              print "#define _LIBCPP_HAS_THREAD_API_PTHREAD"; next
            }
            /^#cmakedefine[ \t]+_LIBCPP_HARDENING_MODE_DEFAULT/ {
              print "#define _LIBCPP_HARDENING_MODE_DEFAULT _LIBCPP_HARDENING_MODE_NONE"; next
            }
            /^#cmakedefine[ \t]+_LIBCPP_PSTL_CPU_BACKEND_SERIAL/ {
              print "#define _LIBCPP_PSTL_CPU_BACKEND_SERIAL"; next
            }
            /^#cmakedefine[ \t]+_LIBCPP_PSTL_CPU_BACKEND_(THREAD|LIBDISPATCH)/ {
              name=$2; print "/* #undef " name " */"; next
            }
            /^#cmakedefine[ \t]+/ {
              name=$2; print "/* #undef " name " */"; next
            }
            /^@_LIBCPP_ABI_DEFINES@$/      { next }
            /^@_LIBCPP_EXTRA_SITE_DEFINES@$/ { next }
            { print }
          ' /tmp/__config_site.in > /tmp/__config_site

          echo "----- Generated __config_site -----"
          cat /tmp/__config_site
          echo "------------------------------------"

          for d in $CONFIG_DIRS; do
            cp /tmp/__config_site "$d/__config_site"
          done
          find "$THEOS/toolchain/linux/iphone" -name '__config_site'

      - name: Install iPhoneOS 9.3 SDK
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          mkdir -p "$THEOS/sdks"
          # Community mirror that keeps legacy SDKs with armv7 slices alive.
          curl -fsSL -o /tmp/iphoneos9.3.sdk.tbz2 \
            "https://raw.githubusercontent.com/Sn0wCooder/theos-sdks/master/iPhoneOS9.3.sdk.tbz2"
          tar -xjf /tmp/iphoneos9.3.sdk.tbz2 -C "$THEOS/sdks"
          ls "$THEOS/sdks"

      - name: Fix legacy module maps in SDK (clang 19)
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          # clang 19 rejects the old 'module.map' name
          # (-Wdeprecated-module-dot-map) and refuses to build the
          # Foundation/UIKit modules. Rename to the modern name, as the
          # compiler itself suggests.
          SDK="$THEOS/sdks/iPhoneOS9.3.sdk"
          for fw in "$SDK"/System/Library/Frameworks/*.framework; do
            if [ -f "$fw/module.map" ]; then
              mkdir -p "$fw/Modules"
              mv "$fw/module.map" "$fw/Modules/module.modulemap"
            fi
          done
          find "$SDK/usr/include" -name module.map | while read -r m; do
            mv "$m" "$(dirname "$m")/module.modulemap"
          done
          echo "remaining module.map files:"
          find "$SDK" -name module.map | wc -l

      - name: Set up cross-compile environment vars
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          echo "IOS_CC=$THEOS/toolchain/linux/iphone/bin/clang" >> $GITHUB_ENV
          echo "IOS_SYSROOT=$THEOS/sdks/iPhoneOS9.3.sdk" >> $GITHUB_ENV
          echo "IOS_STAGE=${{ github.workspace }}/theos/vendor" >> $GITHUB_ENV

          # This clang binary is a vanilla/LLVM.org-style clang (not
          # Apple's clang), which does NOT understand Apple driver
          # flags like -arch or -miphoneos-version-min - those only
          # exist in Apple's own clang fork. A vanilla clang is a
          # genuine cross-compiler instead: you select the target via
          # --target=<arch>-apple-ios<version>, which sets the
          # architecture AND OS/deployment version in one flag, and
          # -isysroot still works the same way to point at the SDK.
          # (This is what caused "unsupported option '-arch' for
          # target 'x86_64-unknown-linux-gnu'" - the compiler was
          # silently defaulting to a host build because none of our
          # flags actually selected an iOS target.)
          echo "IOS_TARGET_FLAGS=--target=armv7-apple-ios${IOS_DEPLOY_TARGET} -isysroot $THEOS/sdks/iPhoneOS9.3.sdk" >> $GITHUB_ENV

          # Archiver: prefer llvm-ar bundled next to clang in this
          # toolchain release (standard for L1ghtmann/sbingner-style
          # iOS cross toolchains, which usually ship llvm-ar/llvm-ranlib
          # rather than plain ar/ranlib). Fall back to the host's ar,
          # which is fine here - we're only archiving already-compiled
          # armv7 Mach-O objects into a plain .a, a format-level
          # operation that doesn't require a target-aware archiver.
          TOOLBIN="$THEOS/toolchain/linux/iphone/bin"
          if [ -x "$TOOLBIN/llvm-ar" ]; then
            echo "IOS_AR=$TOOLBIN/llvm-ar" >> $GITHUB_ENV
          else
            echo "IOS_AR=$(command -v ar)" >> $GITHUB_ENV
          fi
          ls "$TOOLBIN"

          # Sanity check right here, in this step, so a broken target
          # selection fails fast with a clear message instead of 45
          # minutes into the workflow inside a library build.
          echo 'int main(void){return 0;}' > /tmp/target_check.c
          "$THEOS/toolchain/linux/iphone/bin/clang" \
            --target=armv7-apple-ios${IOS_DEPLOY_TARGET} \
            -isysroot "$THEOS/sdks/iPhoneOS9.3.sdk" \
            -c /tmp/target_check.c -o /tmp/target_check.o
          file /tmp/target_check.o || true
          # Fail fast if the object doesn't carry the 7.0 deployment target.
          if command -v otool >/dev/null 2>&1; then
            otool -l /tmp/target_check.o | grep -A3 -E 'LC_VERSION_MIN|LC_BUILD_VERSION' || true
          fi

      - name: Cross-compile zlib for armv7/iOS
        run: |
          mkdir -p "$IOS_STAGE"/{lib,include}

          # zlib.net occasionally serves a non-gzip response (HTML error/
          # interstitial page with a 200 status, or a transient CDN hiccup)
          # to datacenter IPs like GitHub Actions runners, which curl -f
          # doesn't catch since the HTTP status itself is fine - tar then
          # fails with "not in gzip format" on what's actually an HTML
          # page. Retry a few times, verify the magic bytes are real
          # gzip (1f 8b) before extracting, and fall back to the GitHub
          # mirror of the same release tag if zlib.net keeps failing.
          fetch_zlib() {
            local url="$1"
            for attempt in 1 2 3; do
              curl -fsSL --retry 2 --retry-delay 2 -o /tmp/zlib.tar.gz "$url" && \
              [ "$(head -c2 /tmp/zlib.tar.gz | xxd -p)" = "1f8b" ] && return 0
              echo "Attempt $attempt from $url did not yield a valid gzip file, retrying..."
              sleep 3
            done
            return 1
          }

          fetch_zlib "https://zlib.net/fossils/zlib-1.3.1.tar.gz" \
            || fetch_zlib "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz" \
            || { echo "::error::Could not download a valid zlib-1.3.1.tar.gz from any source"; exit 1; }

          mkdir -p /tmp/zlib && tar -xzf /tmp/zlib.tar.gz -C /tmp/zlib --strip-components=1
          cd /tmp/zlib

          # zlib's ./configure runs a live test-compile and aborts on
          # *any* compiler stderr output ("Compiler error reporting is
          # too harsh... aborting"), even a plain warning with no
          # -Werror involved anywhere. Cross-compiling with this Theos
          # clang toward an iOS sysroot reliably produces at least one
          # warning on that probe, which is enough to trip it - hence
          # the failure, unrelated to our actual CFLAGS being wrong.
          #
          # Sidestep ./configure entirely: zlib is a fixed, small set of
          # portable C files with no configure-time feature detection
          # that matters for this platform (HAVE_UNISTD_H is really the
          # only one, and iOS has unistd.h), so compile the objects by
          # hand and archive them directly.
          IOS_ARCH_FLAGS="$IOS_TARGET_FLAGS"

          ZLIB_SRCS="adler32 compress crc32 deflate gzclose gzlib gzread gzwrite infback inffast inflate inftrees trees uncompr zutil"
          OBJS=()
          for src in $ZLIB_SRCS; do
            "$IOS_CC" -O3 $IOS_ARCH_FLAGS -DHAVE_UNISTD_H -c "$src.c" -o "$src.o"
            OBJS+=("$src.o")
          done
          "$IOS_AR" rcs libz.a "${OBJS[@]}"

          test -f libz.a || { echo "::error::libz.a was not produced"; exit 1; }
          rm -f "$IOS_STAGE/include/zlib.h" "$IOS_STAGE/include/zconf.h"
          cp libz.a "$IOS_STAGE/lib/"
          cp zlib.h zconf.h "$IOS_STAGE/include/"
          echo "libz.a built: $(du -h "$IOS_STAGE/lib/libz.a")"
          echo "ZLIB_VERNUM in staged header:"
          grep ZLIB_VERNUM "$IOS_STAGE/include/zlib.h"

      - name: Cross-compile libpng for armv7/iOS
        run: |
          curl -fsSL -o /tmp/libpng.tar.gz \
            https://download.sourceforge.net/libpng/libpng-1.6.44.tar.gz
          mkdir -p /tmp/libpng && tar -xzf /tmp/libpng.tar.gz -C /tmp/libpng --strip-components=1
          cd /tmp/libpng

          # Make sure our hand-built armv7 zlib.h is the ONLY zlib header
          # this compiler can see. The libpng version check in pngpriv.h
          # compares ZLIB_VERNUM (from whichever zlib.h gets included)
          # against PNG_ZLIB_VERNUM (recorded from the zlib.h seen at
          # configure time). If the compile step for png.c/pngget.c/etc
          # resolves zlib.h via a different search path than the configure
          # probe did (e.g. falls through to the host's /usr/include/zlib.h
          # because our -I wasn't first, or wasn't passed to that specific
          # compile), the versions mismatch and every .c file that includes
          # pngpriv.h fails identically - which is exactly the symptom here.
          echo "zlib.h resolved by search path:"
          echo | "$IOS_CC" $IOS_TARGET_FLAGS -I"$IOS_STAGE/include" -E -H -xc - <<< '#include <zlib.h>' 2>&1 | grep zlib.h | head -5

          CC="$IOS_CC" \
          AR="$IOS_AR" \
          RANLIB=: \
          CPPFLAGS="-I$IOS_STAGE/include" \
          CFLAGS="$IOS_TARGET_FLAGS -I$IOS_STAGE/include" \
          LDFLAGS="$IOS_TARGET_FLAGS -L$IOS_STAGE/lib" \
          ZLIBLIB="$IOS_STAGE/lib" \
          ZLIBINC="$IOS_STAGE/include" \
          ./configure --host=arm-apple-darwin --disable-shared --enable-static \
                      --prefix=/tmp/libpng-out

          # Belt-and-suspenders: libpng's Makefile can carry its own
          # DEFAULT_INCLUDES / CPPFLAGS separate from what configure was
          # invoked with. Force our zlib include first on every actual
          # compile, regardless of what configure decided to bake in.
          make -j"$(nproc)" CPPFLAGS="-I$IOS_STAGE/include" CFLAGS="$IOS_TARGET_FLAGS -I$IOS_STAGE/include"
          make install
          cp /tmp/libpng-out/lib/libpng16.a "$IOS_STAGE/lib/"
          cp /tmp/libpng-out/include/*.h "$IOS_STAGE/include/"

      - name: Cross-compile SDL2 for armv7/iOS from source
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          # Built straight from libsdl-org/SDL's SDL2 branch (real repo,
          # not a guessed mirror). SDL2's own iOS build path assumes
          # Xcode/xcodebuild (Xcode-iOS/SDL/SDL.xcodeproj, or CMake's
          # CMAKE_OSX_SYSROOT which itself shells out to xcrun) - neither
          # exists on this Ubuntu runner, only the Theos clang cross
          # toolchain. So we compile the iOS-relevant source subset
          # directly, mirroring exactly the source groups Xcode-iOS's own
          # project.pbxproj builds for the device target:
          #   - src/*.c                    (core, platform-independent)
          #   - src/video/uikit/*.m        (UIKit window/view backend)
          #   - src/video/*.c              (shared video subsystem)
          #   - src/render/**/*.c          (SDL_Renderer, software + GLES)
          #   - src/audio/coreaudio/*.c    (CoreAudio backend)
          #   - src/joystick/iphoneos/*.m  (GameController-backed joystick)
          #   - src/haptic/dummy/*.c       (iOS has no generic haptic backend pre-CoreHaptics)
          #   - src/power/uikit/*.m, src/filesystem/cocoa/*.m, src/loadso/dlopen/*.c
          #   - src/thread/pthread/*.c, src/timer/unix/*.c
          #   - src/file/*.c, src/events/*.c, src/stdlib/*.c, src/atomic/*.c, src/cpuinfo/*.c
          #   - src/dynapi/*.c
          # This mirrors upstream's own Xcode-iOS/SDL/SDL.xcodeproj group
          # structure (confirmed against project.pbxproj) rather than
          # guessing at a file list.
          # Pinned to release-2.0.9, NOT branch HEAD. Later SDL2 commits
          # (~2.0.10+) added AVAudioSession options that only exist on
          # iOS 10+ SDKs (AllowBluetoothA2DP, AllowAirPlay, and the
          # setCategory:mode:options:error: selector), which fail to
          # compile against this iOS 9.3 SDK with "undeclared identifier"
          # errors. 2.0.9 predates that coreaudio rewrite and targets
          # the deployment era this SDK actually supports.
          git clone --branch release-2.0.9 --depth 1 https://github.com/libsdl-org/SDL.git /tmp/sdl2
          cd /tmp/sdl2

          # iPad mini 1 is an A5 chip - Metal requires A7+, so this
          # device cannot use Metal at all. Force GLES2 as the renderer
          # and explicitly disable Metal so SDL never attempts to
          # compile or select it, even accidentally.
          IOS_CFLAGS="$IOS_TARGET_FLAGS -fobjc-arc -DSDL_VIDEO_RENDER_OGL_ES=0 -DSDL_VIDEO_RENDER_OGL_ES2=1 -DSDL_VIDEO_RENDER_METAL=0 -DGL_SILENCE_DEPRECATION -Iinclude -I."

          # This community SDK mirror (Sn0wCooder/theos-sdks) is labeled
          # iPhoneOS9.3.sdk but its UIApplication.h is missing
          # UIApplicationOpenURLOptionsKey, a real iOS 9.0+ symbol that
          # SDL_uikitappdelegate.m uses in a method signature. Rather
          # than patch SDL source (fragile against upstream changes),
          # shim the missing typedef via a force-included header so it
          # exists regardless of what this particular SDK mirror ships.
          #
          # This shim now lives permanently at ios93_compat_shim.h in
          # the repo root (not just here in /tmp) because AppDelegate.mm
          # needs the exact same fix when Theos compiles it directly -
          # see AppDelegate.mm_CFLAGS in the Makefile. Copy the
          # repo-tracked copy here so both compile paths use one
          # source of truth instead of two copies drifting apart.
          cp "$GITHUB_WORKSPACE/ios93_compat_shim.h" /tmp/ios93_compat_shim.h

          # ---------------------------------------------------------
          # iOS 7.x compatibility patches for SDL 2.0.9's UIKit backend.
          # SDL 2.0.9 targets iOS 8+ in a few places. Each of these is a
          # HARD crash on 7.1.2 (unrecognized selector / missing class),
          # not a warning, so patch them at build time instead of
          # shipping a fork of SDL.
          # ---------------------------------------------------------

          # 1) UIScreen.nativeScale / nativeBounds are iOS 8+. On 7.x use
          #    [UIScreen scale] and bounds (iPad 1 is non-retina, scale 1).
          grep -rl "nativeScale\|nativeBounds" src/video/uikit || true
          sed -i 's/\[UIScreen mainScreen\]\.nativeScale/[UIScreen mainScreen].scale/g' src/video/uikit/*.m src/video/uikit/*.h
          sed -i 's/uiscreen\.nativeScale/uiscreen.scale/g'                       src/video/uikit/*.m src/video/uikit/*.h
          sed -i 's/screen\.nativeScale/screen.scale/g'                           src/video/uikit/*.m src/video/uikit/*.h
          sed -i 's/uiscreen\.nativeBounds/uiscreen.bounds/g'                     src/video/uikit/*.m src/video/uikit/*.h
          sed -i 's/screen\.nativeBounds/screen.bounds/g'                         src/video/uikit/*.m src/video/uikit/*.h

          # 2) UIScreen.coordinateSpace / fixedCoordinateSpace are iOS 8+.
          grep -rn "coordinateSpace" src/video/uikit || true

          # 3) safeAreaInsets / UIWindowScene etc. are iOS 11+/13+ and are
          #    already behind @available in 2.0.9 (handled by our
          #    __isPlatformVersionAtLeast stub, which returns false on 7.1.2).

          # 4) Report anything else that references APIs > iOS 7 so a
          #    failed run is diagnosable from the log.
          # 3b) SDL_uikitmessagebox.m references UIAlertController (iOS 8+).
          #     Even behind a runtime @available check, the class ref is a
          #     STRONG import -> dyld "Symbol not found" on 7.1.2 before
          #     main() runs. Replace the whole message-box backend with a
          #     stub that reports "unsupported"; Caprice32 never uses
          #     SDL_ShowMessageBox (errors go to the log).
          printf '%s\n' \
            '#include "../../SDL_internal.h"' \
            '#if SDL_VIDEO_DRIVER_UIKIT' \
            '#include "SDL_video.h"' \
            '#include "SDL_uikitmessagebox.h"' \
            'SDL_bool UIKit_ShowingMessageBox(void) { return SDL_FALSE; }' \
            'int UIKit_ShowMessageBox(const SDL_MessageBoxData *messageboxdata, int *buttonid)' \
            '{' \
            '    (void)messageboxdata; (void)buttonid;' \
            '    return SDL_SetError("Message boxes are not supported on this iOS build");' \
            '}' \
            '#endif' \
            > src/video/uikit/SDL_uikitmessagebox.m
          grep -n "UIKit_ShowingMessageBox\|UIKit_ShowMessageBox" src/video/uikit/SDL_uikitmessagebox.h || true

          echo "---- possible iOS 8+ API references remaining in uikit backend ----"
          grep -rnE "UIAlertController|UIVisualEffect|traitCollection|preferredContentSize|UIApplicationOpenSettings|isLowPowerModeEnabled|NSProcessInfo.*operatingSystemVersion|UIScreenOverscan|UIWindowScene" src/video/uikit src/main/ios src/core/uikit 2>/dev/null || true
          echo "-------------------------------------------------------------------"

          SRC_DIRS="src src/audio src/audio/coreaudio src/audio/disk src/audio/dummy \
            src/atomic src/cpuinfo src/dynapi src/events src/file src/file/cocoa src/haptic src/haptic/dummy \
            src/joystick src/joystick/iphoneos src/loadso/dlopen src/power src/power/uikit \
            src/filesystem/cocoa src/render src/render/software src/render/opengles src/render/opengles2 \
            src/thread src/thread/pthread src/thread/generic src/timer src/timer/unix \
            src/stdlib src/libm src/video src/video/uikit src/video/dummy src/video/yuv2rgb \
            src/misc src/misc/unix src/main/ios src/core/uikit \
            src/sensor src/sensor/dummy src/sensor/coremotion src/locale src/locale/unix"

          OBJDIR=/tmp/sdl2-obj
          mkdir -p "$OBJDIR"
          OBJS=()

          for d in $SRC_DIRS; do
            [ -d "$d" ] || continue
            for f in "$d"/*.c "$d"/*.m; do
              [ -f "$f" ] || continue
              # Skip any Metal source outright - target device (A5) has
              # no Metal support, and these files may pull in MetalKit
              # headers the iOS 9.3 SDK doesn't fully carry anyway.
              case "$(basename "$f")" in
                *metal*|*Metal*) echo "Skipping Metal source: $f"; continue ;;
              esac
              base="$(echo "$f" | tr '/' '_')"
              obj="$OBJDIR/${base%.*}.o"
              echo "Compiling $f"
              case "$f" in
                *.m) "$IOS_CC" $IOS_CFLAGS -include /tmp/ios93_compat_shim.h -c "$f" -o "$obj" ;;
                *)   "$IOS_CC" $IOS_CFLAGS -c "$f" -o "$obj" ;;
              esac
              OBJS+=("$obj")
            done
          done

          "$IOS_AR" rcs "$IOS_STAGE/lib/libSDL2.a" "${OBJS[@]}"
          mkdir -p "$IOS_STAGE/include/SDL2"
          cp include/*.h "$IOS_STAGE/include/SDL2/"
          # AppDelegate.mm includes SDL_uikitappdelegate.h directly (the
          # standard pattern for SDL2 iOS app delegates, matching SDL's
          # own Xcode-iOS/SDL/main/ios/SDL_uikit_main.m usage). That
          # header - and its siblings like SDL_uikitwindow.h,
          # SDL_uikitview.h, SDL_uikitviewcontroller.h - lives under
          # src/video/uikit/, not include/, so the copy above misses it
          # entirely. Stage the uikit backend's public-ish headers too.
          cp src/video/uikit/SDL_uikitappdelegate.h \
             src/video/uikit/SDL_uikitwindow.h \
             src/video/uikit/SDL_uikitview.h \
             src/video/uikit/SDL_uikitviewcontroller.h \
             src/video/uikit/SDL_uikitopenglview.h \
             src/video/uikit/SDL_uikitmetalview.h \
             src/video/uikit/SDL_uikitmodes.h \
             src/video/uikit/SDL_uikitevents.h \
             "$IOS_STAGE/include/SDL2/" 2>/dev/null || true
          echo "libSDL2.a built: $(du -h "$IOS_STAGE/lib/libSDL2.a")"

      - name: Cross-compile freetype2 for armv7/iOS
        run: |
          # savannah.gnu.org occasionally 500s (seen in CI: "curl: (22)
          # The requested URL returned error: 500") - it's a general
          # mirror-network flakiness issue, not something wrong with our
          # request. Retry a few times, and fall back to SourceForge,
          # which hosts the identical release tarball (it's listed as
          # freetype's own upstream mirror, e.g. in Homebrew's formula).
          fetch_freetype() {
            local url="$1"
            for attempt in 1 2 3; do
              curl -fsSL --retry 2 --retry-delay 2 -o /tmp/freetype.tar.gz "$url" && \
              [ "$(head -c2 /tmp/freetype.tar.gz | xxd -p)" = "1f8b" ] && return 0
              echo "Attempt $attempt from $url did not yield a valid gzip file, retrying..."
              sleep 3
            done
            return 1
          }

          fetch_freetype "https://download.savannah.gnu.org/releases/freetype/freetype-2.13.2.tar.gz" \
            || fetch_freetype "https://downloads.sourceforge.net/project/freetype/freetype2/2.13.2/freetype-2.13.2.tar.gz" \
            || { echo "::error::Could not download a valid freetype-2.13.2.tar.gz from any source"; exit 1; }

          mkdir -p /tmp/freetypesrc && tar -xzf /tmp/freetype.tar.gz -C /tmp/freetypesrc --strip-components=1
          cd /tmp/freetypesrc
          CC="$IOS_CC" \
          AR="$IOS_AR" \
          RANLIB=: \
          CFLAGS="$IOS_TARGET_FLAGS" \
          LDFLAGS="$IOS_TARGET_FLAGS" \
          ./configure --host=arm-apple-darwin --disable-shared --enable-static \
                      --without-harfbuzz --without-bzip2 --without-brotli \
                      --with-zlib=no --with-png=no \
                      --prefix=/tmp/freetype-out
          make -j"$(nproc)"
          make install
          cp /tmp/freetype-out/lib/libfreetype.a "$IOS_STAGE/lib/"
          mkdir -p "$IOS_STAGE/include/freetype2"
          cp -r /tmp/freetype-out/include/freetype2/* "$IOS_STAGE/include/freetype2/"
          echo "libfreetype.a built: $(du -h "$IOS_STAGE/lib/libfreetype.a")"

      - name: Stage libs into Theos SDK lib dir
        run: |
          # NOTE: THEOS_STAGING_DIR is a Theos *system* variable (staged
          # package/product output dir - see theos.dev/docs/variables),
          # NOT a place to point at the SDK. Overwriting it here was
          # clobbering Theos's own internal staging path, which broke
          # its SDK auto-detection in before-all ("You do not have any
          # SDKs in .../theos/sdks", even though the SDK was right
          # there). Use a distinct name and consume it as SDK_ROOT in
          # the app Makefile instead.
          SDK_ROOT="$THEOS/sdks/iPhoneOS9.3.sdk"
          mkdir -p "$SDK_ROOT/usr/lib" "$SDK_ROOT/usr/include"
          cp "$IOS_STAGE"/lib/*.a "$SDK_ROOT/usr/lib/"
          cp -r "$IOS_STAGE"/include/* "$SDK_ROOT/usr/include/"
          echo "SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV

      - name: Build .deb + .app via Theos
        env:
          THEOS: ${{ github.workspace }}/theos
          FINALPACKAGE: "1"
        run: |
          # This repo has both a desktop build 'makefile' (lowercase,
          # uses pkg-config/sdl2-config) and the Theos iOS 'Makefile'
          # (capital M). GNU Make's default search order is
          # GNUmakefile > makefile > Makefile, so a bare `make` on this
          # case-sensitive Linux runner was silently building the
          # desktop makefile instead - explaining the pkg-config/
          # sdl2-config warnings and missing SDL.h (that makefile has
          # no idea about $(THEOS_STAGING_DIR)). Force the correct file.
          make -f Makefile clean
          make -f Makefile package FINALPACKAGE=1 SDK_ROOT="$SDK_ROOT" V=1 VERBOSE=1
          ls -la packages

      - name: Verify deployment target of built binary
        run: |
          BIN="$(find .theos -type f -name 'Caprice32ARMv7' | head -n1)"
          echo "Binary: $BIN"
          file "$BIN" || true
          TOOLBIN="$THEOS/toolchain/linux/iphone/bin"
          OTOOL="$(ls "$TOOLBIN"/*otool* "$TOOLBIN"/llvm-objdump 2>/dev/null | head -n1)"
          echo "Using: $OTOOL"
          if [ -n "$OTOOL" ]; then
            case "$OTOOL" in
              *objdump) "$OTOOL" --macho --private-headers "$BIN" | grep -B1 -A4 -E 'LC_VERSION_MIN|LC_BUILD_VERSION' || true ;;
              *)        "$OTOOL" -l "$BIN" | grep -A4 -E 'LC_VERSION_MIN|LC_BUILD_VERSION' || true ;;
            esac
          fi

      - name: Check binary for symbols missing on iOS 7.1.2
        run: |
          # dyld on 7.1.2 aborts at launch with "Symbol not found" if the
          # binary imports a *strong* symbol that doesn't exist in that
          # OS. Anything below is iOS 8+ (or newer) API. Report them so a
          # crash-on-launch is diagnosable from the CI log alone.
          BIN="$(find .theos -type f -name 'Caprice32ARMv7' | head -n1)"
          TOOLBIN="$THEOS/toolchain/linux/iphone/bin"
          NM="$(ls "$TOOLBIN"/llvm-nm "$TOOLBIN"/*-nm 2>/dev/null | head -n1)"
          [ -z "$NM" ] && NM="$(command -v llvm-nm || command -v nm)"
          echo "nm: $NM"
          "$NM" -u "$BIN" > /tmp/undef.txt 2>/dev/null || true
          echo "undefined symbols total: $(wc -l < /tmp/undef.txt)"
          echo "---- suspicious (iOS 8+/9+/10+) imports ----"
          grep -E "UIAlertController|UIAlertAction|UIVisualEffect|UIStackView|UIWindowScene|UIFeedbackGenerator|CHHaptic|MTL|_OBJC_CLASS_\$_(CAMetalLayer|MTL|WKWebView|NSURLSession|UIDocumentPicker|SFSafari|UISelectionFeedback)|_OBJC_CLASS_\$_GCController|__isPlatformVersionAtLeast|nativeScale|safeAreaInsets" /tmp/undef.txt || echo "(none)"
          echo "---- weak-linked check for GameController ----"
          grep -E "GameController" /tmp/undef.txt || true
          # Hard-fail only on classes that definitely don't exist on 7.1.2
          # AND are not weak. Metal / UIAlertController would be fatal.
          if grep -E "_OBJC_CLASS_\$_(UIAlertController|MTLCreateSystemDefaultDevice|CAMetalLayer|UIStackView|UIVisualEffectView|UIWindowScene)" /tmp/undef.txt; then
            echo "::error::Binary strongly imports a class absent on iOS 7.1.2"
            exit 1
          fi

      - name: Pack .ipa from staged .app
        run: |
          rm -rf ipa_build
          mkdir -p ipa_build/Payload
          APP_DIR=".theos/obj/Caprice32ARMv7.app"
          if [ ! -d "$APP_DIR" ]; then
            APP_DIR=".theos/obj/armv7/Caprice32ARMv7.app"
          fi
          if [ ! -d "$APP_DIR" ]; then
            APP_DIR="$(find .theos -type d -name 'Caprice32ARMv7.app' | head -n1)"
          fi
          echo "Using APP_DIR=$APP_DIR"
          cp -a "$APP_DIR" ipa_build/Payload/
          (cd ipa_build && zip -rq ../packages/Caprice32-${{ steps.commit-info.outputs.hash }}-armv7-iOS7.1.2.ipa Payload)
          ls -la packages

      - name: Upload .ipa + .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Caprice32-armv7-iOS7.1.2-${{ steps.commit-info.outputs.hash }}
          path: |
            packages/*.ipa
            packages/*.deb
          if-no-files-found: error
          retention-days: 30
