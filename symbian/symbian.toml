# Package identity for `symbian package` (see the SDK's "Package an application" guide).
# All fields are required, unknown fields are rejected. The package UID must differ from the executable UID3
# (0xe0000831, set in CMakeLists.txt via symbian_publish_executable).
[package]
uid = 0xe0000832
name = "Caprice32"
vendor = "caprice32-port"
executable_name = "caprice32.exe"
version = [0, 1, 0]

# The SDK's SIS writer packages only the executable (plus optional [application] menu resources); it cannot embed
# data files. Copy cap32.cfg and the ROM images to the phone manually (see README_PORT.md).
